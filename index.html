function updateCritter(c, dt, isSrc) {
  stepSpring(c.sx, dt, 300, 14); stepSpring(c.sy, dt, 300, 14);
  c.blinkT -= dt; if (c.blinkT < 0) { c.blink = .14; c.blinkT = U.rand(2, 5); } c.blink = Math.max(0, c.blink - dt);
  c.exprT -= dt; if (c.exprT < 0 && c.expr !== 'idle') c.expr = 'idle';
  c.shake = Math.max(0, c.shake - dt);
  if (!isSrc) return;
  // mirada: al cursor, al foco o al cable que se tiende
  let tx = pointer.inside ? pointer.x : c.hx, ty = pointer.inside ? pointer.y : c.hy + 40;
  if (hold) { tx = hold.x === c.v ? PADS[0].x : srcs[hold.x].hx; ty = hold.x === c.v ? 420 : srcs[hold.x].hy; }
  const ang = Math.atan2(ty - c.hy, tx - c.hx), dd = U.clamp(Math.hypot(tx - c.hx, ty - c.hy) / 200, 0, 1);
  c.lookX = U.lerp(c.lookX, Math.cos(ang) * dd, Math.min(1, dt * 6)); c.lookY = U.lerp(c.lookY, Math.sin(ang) * dd, Math.min(1, dt * 6));
  // gestos espontáneos con personalidad
  c.actT -= dt;
  if (c.actT < 0 && !Run.active && !SET.reduced) {
    c.actT = U.rand(4, 9);
    if (c.v === 0) { tw.add(c, { flat: 1 }, .5, { ease: Ease.inOut, done: () => tw.add(c, { flat: 0 }, .4, { delay: U.rand(.6, 1.6), ease: Ease.back }) }); }
    else if (c.v === 1) { hopC(c, 34); if (Math.random() < .5) later(.45, () => hopC(c, 22)); }
    else if (c.v === 2) { setExpr(c, 'angry', 1.2); c.shake = .4; if (Math.random() < .3) Sound.voice(2, 'angry'); }
    else if (c.v === 3) { tw.add(c, { puff: 1 }, .4, { ease: Ease.back, done: () => tw.add(c, { puff: 0 }, .5, { delay: .8 }) }); setExpr(c, 'proud', 1.6); }
  }
  if (c.v === 1 && !SET.reduced) c.idleBob = Math.abs(Math.sin(realT * 5.2)) * 3; else c.idleBob = 0;
}
function update(dt) {
  realT += dt;
  Draw.boil = SET.reduced ? 0 : Math.floor(realT * 8) % 3;
  Draw.wob = SET.reduced ? .4 : 1;
  for (const t of timers) { if (t.dead) continue; t.t -= dt; if (t.t <= 0) { t.dead = true; t.fn(); } }
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].dead) timers.splice(i, 1);
  tw.update(dt);
  updateRun(dt);
  srcs.forEach(c => updateCritter(c, dt, true));
  natives.forEach(c => updateCritter(c, dt, false));
  residents.forEach(c => updateCritter(c, dt, false));
  tokens.forEach(c => updateCritter(c, dt, false));
  // bloques: siguen su sitio lógico con un muelle (peso y rebote)
  const cfg = L.config;
  Object.values(blocks).forEach(b => {
    let tx, ty;
    if (b.drag) { tx = b.tx; ty = b.ty; }
    else { const s = AlgebraCore.SLOTS.find(q => cfg.slots[q] === b.id); if (s) { const r = SLOT_RECT[s]; tx = r.x + r.w / 2; ty = r.y + r.h / 2; } else { const p = trayPos(cfg.tray.indexOf(b.id)); tx = p.x; ty = p.y; } }
    const k = b.drag ? 900 : 260, d = b.drag ? 50 : 20;
    // subpasos: el muelle es rígido y con fotogramas lentos el integrador explícito se desbocaba
    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (let i = 0; i < n; i++) { const ax = k * (tx - b.x) - d * b.vx, ay = k * (ty - b.y) - d * b.vy; b.vx += ax * h; b.vy += ay * h; b.x += b.vx * h; b.y += b.vy * h; }
    b.rot = U.lerp(b.rot, U.clamp(b.vx / 2400, -.35, .35) + (b.drag ? 0 : 0), Math.min(1, dt * 10));
    b.shake = Math.max(0, b.shake - dt); stepSpring(b.sq, dt, 400, 18);
  });
  // máquina
  machine.gearSpeed = U.lerp(machine.gearSpeed, machine.gearTarget, Math.min(1, dt * 2));
  machine.gear += machine.gearSpeed * dt * (Run.paused ? 0 : 1);
  machine.shake = Math.max(0, machine.shake - dt); machine.steam = Math.max(0, machine.steam - dt); machine.bellyShake = Math.max(0, machine.bellyShake - dt);
  if (machine.steam > 0 && Math.random() < dt * 14) steamAt(MACH.x + MACH.w - 40, MACH.y + 10, 1);
  stepSpring(machine.lever, dt, 220, 12);
  for (const s in machine.slotShake) machine.slotShake[s] = Math.max(0, machine.slotShake[s] - dt);
  for (const s in machine.knobPress) machine.knobPress[s] = Math.max(0, machine.knobPress[s] - dt * 4);
  for (let i = 0; i < 4; i++) { machine.cordWob[i] *= Math.pow(.02, dt); machine.cordPulse[i] = Math.max(0, machine.cordPulse[i] - dt * 1.4); }
  machine.rjackPress = machine.rjackPress.map(v => Math.max(0, v - dt * 5));
  stepSpring(boss.bounce, dt, 300, 12);
  boss.exprT -= dt; if (boss.exprT < 0 && boss.expr !== 'sleep' && boss.expr !== 'focus') boss.expr = machine.awake ? 'idle' : 'sleep';
  if (!Run.active && boss.expr === 'focus') boss.expr = machine.awake ? 'idle' : 'sleep';
  if (!machine.awake && !Run.active && boss.expr !== 'sleep' && boss.exprT < 0) boss.expr = 'sleep';
  boss.blinkT -= dt; if (boss.blinkT < 0) { boss.blink = .15; boss.blinkT = U.rand(2, 5); } boss.blink = Math.max(0, boss.blink - dt);
  if (!machine.awake && Math.random() < dt * .25 && !SET.reduced) Sound.ok() && nth('snore') % 3 === 0 && Sound.snore();
  stepSpring(scaleS.beam, dt, 120, 8); scaleS.flash = Math.max(0, scaleS.flash - dt * 4);
  ledger.pop = ledger.pop.map(v => Math.max(0, v - dt * 3));
  order.stampT = Math.max(0, order.stampT - dt * 2);
  for (const m in marks.pop) marks.pop[m] = Math.max(0, marks.pop[m] - dt * .8);
  // partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.t += dt;
    if (q.kind === 'paper') { q.vy += 520 * dt; q.vx *= Math.pow(.4, dt); q.vy = Math.min(q.vy, 160); q.x += (q.vx + Math.sin(q.t * 6 + q.r) * 40) * dt; }
    else { q.vx *= Math.pow(.2, dt); q.x += q.vx * dt; }
    q.y += q.vy * dt; q.rot += q.vr * dt;
    if (q.t > q.life) particles.splice(i, 1);
  }
  // burbujas
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.t += dt; b.s = Math.min(1, b.s + dt * 7); if (b.t > b.dur) bubbles.splice(i, 1); }
  if (pointerHint) { pointerHint.t += dt; if (pointerHint.t > pointerHint.dur) pointerHint = null; }
  // ayuda pasiva: si lleva tiempo sin avanzar, la pista se ilumina (y luego se ofrece sola una vez)
  const idle = realT - progress.lastProgress;
  progress.hintGlow = idle > 55 && !progress.solved ? 1 : 0;
  if (idle > 120 && !progress.autoHinted && !progress.solved && !Run.active) { progress.autoHinted = true; giveHint(true); }
}

  const e = pts[12], p = pts[10], dir = Math.atan2(e[1] - p[1], e[0] - p[0]);
  Draw.curve([[e[0] + Math.cos(dir + 2.6) * 11, e[1] + Math.sin(dir + 2.6) * 11], e, [e[0] + Math.cos(dir - 2.6) * 11, e[1] + Math.sin(dir - 2.6) * 11]], 2.5, PAL.ink);
  const am = (a0 + a1) / 2, lr = Math.abs(labelR);
  Draw.text('+1', cx + Math.cos(am) * lr, cy + Math.sin(am) * lr, { size: 16, color: PAL.ink });
}

function drawToken(t) {

/* ---------------- la ejecución ---------------- */
function lead() { const moving = pieces.filter(p => p.moving); return moving.length ? moving[moving.length - 1] : null; }
function trayPieces(j) { return pieces.filter(p => p.tray === j && !p.moving && p.alpha > .5); }
function slotIn(j, k) { const t = TRAY(j); return { x: t.x - 52 + (k % 3) * 52, y: t.y - 6 - Math.floor(k / 3) * 30 }; }
function runBelt() {
  if (S.run.active) { S.run.scale = 6; return; }
  App.levelStarted(2); S.progress(); if (S.clip.target) S.clip.toggle();
  pieces = []; bench = []; sel = []; S.verdict = null; if (S.slip) S.slip.closing = true;
  const d = P.diagnose(), f = P.map();
  ran = true; lastDiag = null;
  Sound.fam('hum'); beltOn = 1;
  S.run.start((function* () {
    cam.follow = () => { const l = lead(); return l ? { x: l.x + 120, y: 450 } : null; };
    const tw = S.run.tw;
    for (let x = 0; x < G.n; x++) {
      const src = dock[x], p = makeCritter('src', x, src.x, src.y, speciesFor('Z4', x));
      p.s = .74; p.moving = true; p.origin = x; pieces.push(p);
      poke(src, 6, -6); setExpr(src, 'happy', 1);
      // del muelle a la cinta, luego hasta la estampadora
      Kit.travel(tw, p, [[src.x, src.y], [src.x + 40, src.y - 50], [BELT.x0 + 10, 600], [BELT.x0 + 30, BELT.y - 4]], .7, { hops: 1, antic: true, land: true, done: () => {
        Kit.travel(tw, p, [[BELT.x0 + 30, BELT.y - 4], [PRESS.x, BELT.y - 4]], 1.1, { ease: Ease.linear, done: () => stamp(p, x, f[x]) });
      } });
      yield .9;
    }
    yield 3.2;
    beltOn = 0;
    // reacciones de quienes comparten bandeja
    const shared = HH.labels.map((_, j) => trayPieces(j)).filter(l => l.length > 1);
    shared.forEach((l, k) => S.bus.emit('meet', { list: l }, .2 + k * .6));
    yield shared.length ? 1.2 : .2;
    if (!d.analysis.hom) {
      cam.follow = null; cam.goto(1100, 450);
      press.glow = 1; Sound.fam('fail'); operarioDo(op, 'panic', 2.4); op.tool = 'hammer'; op.toolT = 2;
      const c = d.counterexample;
      S.slip = Kit.RouteSlip(G, HH, f, c.a, c.b, { x: 520, y: 650, title: 'LA ESTAMPADORA SE ATASCA EN ESTE PAR' });
      S.dir.play(LINES, 'jam', {}, { force: true, delay: .4 });
      yield 2.6;
    } else {
      yield* inspect(d);
    }
    lastDiag = d; S.verdict = d; cam.follow = null;
    const ev = P.evaluate();
    if (ev.done) S.complete({ nucleo: { G: 'Z4', H: 'Z4', f: [0, 2, 0, 2], from: 'máquina 2, antes de reparar' }, monomorfismo: { G: 'Z4', H: 'Z4', f: ev.map, from: 'máquina 2' } },
      'APROBADO: la garra no encuentra a nadie en el neutro salvo al 0. Monomorfismo. Vuelva a la fábrica (Esc).');
  })(), 'belt');
}
function stamp(p, x, y) {

    p.species = speciesFor('Z4', y); p.hat = { col: SRC_COL[x], label: LG(x) }; p.sx.v = 1.5; p.sy.v = .55; Sound.fam('transform');
    tw.add(press, { y: 0 }, .3, { ease: Ease.out });
    const t = TRAY(y), k = pieces.filter(q => q.tray === y).length, slot = slotIn(y, k);
    p.tray = y;
    Kit.travel(tw, p, [[PRESS.x, BELT.y - 4], [t.x, BELT.y - 4]], .9 + (t.x - PRESS.x) / 1400, { ease: Ease.linear, delay: .15, done: () => {

}

/* la garra recorre el riel, encuentra el neutro y lleva sus piezas a la mesa */
function* inspect(d) {
  const tw = S.run.tw, eH = HH.identity, tray = TRAY(eH);
  cam.follow = () => ({ x: claw.x - 100, y: 430 });
  claw.mood = 'search'; Sound.fam('servo');

  for (let j = HH.n - 1; j >= 0; j--) { tw.add(claw, { x: TRAY(j).x }, .35, { ease: Ease.inOut }); Sound.fam('gear'); yield .42; if (j === eH) break; }
  claw.mood = 'idle'; Sound.fam('bell'); yield .25;
  const found = trayPieces(eH);
  for (let k = 0; k < found.length; k++) {
    const p = found[k];
    tw.add(claw, { x: p.x }, .3, { ease: Ease.inOut }); yield .32;
    tw.add(claw, { y: claw.y - 16 }, .12, { ease: Ease.out }); yield .14;                 // anticipación
    tw.add(claw, { y: p.y - 70 }, .32, { ease: Ease.in }); yield .34;
    tw.add(claw, { open: 0 }, .12); Sound.fam('grab'); yield .16;
    p.carried = true; Kit.react(p, 'surprise', 1.4);
    tw.add(claw, { y: RAIL.y + 60 }, .4, { ease: Ease.inOut }); yield .42;
    const slot = { x: BENCH.x - 50 + bench.length * 44, y: BENCH.y - 12 };
    tw.add(claw, { x: slot.x }, .7 + Math.abs(slot.x - claw.x) / 2400, { ease: Ease.inOut }); yield .8 + Math.abs(slot.x - p.x) / 2400;
    tw.add(claw, { y: slot.y - 70 }, .35, { ease: Ease.inOut }); yield .37;
    tw.add(claw, { open: 1 }, .12); Sound.fam('release');
    p.carried = false; p.x = slot.x; p.y = slot.y; p.hx = slot.x; p.hy = slot.y; p.onBench = true; bench.push(p); pieces = pieces.filter(q => q !== p);
    tw.add(claw, { y: RAIL.y + 60 }, .3); yield .32;
    if (k === 0) { cam.follow = null; cam.goto(BENCH.x - 120, 470); }
  }
  if (found.length > 1) {
    claw.mood = 'happy'; claw.moodT = 3;
    bench.forEach(b => Kit.react(b, 'frustration', 2.6));
    S.dir.play(LINES, 'kernelMany', { list: '{ ' + bench.map(b => b.hat.label).join(', ') + ' }' }, { force: true });
  } else {
    claw.mood = 'frustrated'; claw.moodT = 3; Sound.fam('fail', { vol: .5 });
    S.dir.play(LINES, 'kernelOne', {}, { force: true });
  }
  yield 2.2;
}
/* la lupa comparadora: diferencia de dos piezas y adónde va */
function pick(p) {
  if (lupa.busy || S.run.active) return;
  const i = sel.indexOf(p);
  if (i !== -1) { sel.splice(i, 1); Sound.fam('drag'); return; }
  sel.push(p); Sound.fam('clickin'); Kit.react(p, 'surprise', .8);
  App.announce('Elegida la pieza que era el ' + p.hat.label + '. ' + (sel.length === 1 ? 'Elige otra para la lupa.' : ''));
  if (sel.length === 2) compare(sel[0], sel[1]);
}
function compare(pa, pb) {
  const a = pa.origin, b = pb.origin, r = P.compare(a, b), tw = S.run.tw;
  lupa.busy = true; S.progress();
  S.run.start((function* () {
    cam.follow = null; cam.goto(LUPA.x - 260, 470);
    for (const p of [pa, pb]) {
      tw.add(claw, { x: p.x }, .5, { ease: Ease.inOut }); yield .52;
      tw.add(claw, { y: p.y - 70 }, .3, { ease: Ease.in }); yield .32; tw.add(claw, { open: 0 }, .1); Sound.fam('grab'); yield .12;
      const copy = makeCritter('src', 0, p.x, p.y, p.species); copy.s = .6; copy.hat = p.hat; copy.carried = true; bench.push(copy); copy.temp = true;
      tw.add(claw, { y: RAIL.y + 60 }, .3); yield .32;
      tw.add(claw, { x: LUPA.x + (p === pa ? -30 : 30) }, .6, { ease: Ease.inOut }); yield .62;
      tw.add(claw, { y: LUPA.y - 40 }, .3); yield .32; tw.add(claw, { open: 1 }, .1); Sound.fam('release');
      copy.carried = false; copy.x = LUPA.x + (p === pa ? -30 : 30); copy.y = LUPA.y + 10; yield .1;
      tw.add(claw, { y: RAIL.y + 60 }, .3); yield .3;
    }
    lupa.show = r; lupa.t = 0; Sound.fam('glass');
    yield 1.4;
    lupa.light = r.inKernel ? 1 : -1;
    if (r.inKernel && r.d !== G.identity) {
      Sound.fam('discover'); Kit.react(claw, 'understand'); claw.mood = 'happy'; claw.moodT = 3;
      if (!insight) { insight = true; S.clip.text = 'Que la garra no encuentre nada en el neutro salvo la identidad. Descubierto: si dos piezas comparten destino, su diferencia cae en el neutro.'; }
      S.dir.play(LINES, 'compareSame', { a: LG(a), b: LG(b), d: LG(r.d) }, { force: true });
    } else if (r.d === G.identity) S.say('claw', 'Es la misma pieza dos veces. Diferencia: 0. Eso no demuestra nada.');
    else S.dir.play(LINES, 'compareDiff', { a: LG(a), b: LG(b), d: LG(r.d), fd: LG(r.fd) }, { force: true });
    yield 3;
  })(), 'lupa', () => { lupa.busy = false; sel = []; bench = bench.filter(b => !b.temp); });
}

/* ---------------- estado de escena ---------------- */

const residents = HH.labels.map((_, j) => { const b = BIN(j), c = makeCritter('dst', j, b.x, b.y - 8, speciesFor('Z4', j)); c.s = .9; c.hx = c.x; c.hy = c.y; return c; });
let pieces = [], periscope = { y: null, t: 0 }, drumAng = 0, drumTarget = 0, regTape = [], regLight = 0, gone = { 1: 0, 2: 0, 3: 0, 0: 0 };
let produced = false, peeked = false, lastTest = null, selBin = null, permit = 0, beltT = 0;
const binLift = [0, 0, 0, 0];

function hintState() { const c = P.config; return { produced, peeked, tags: c.tags, codomain: c.codomain, lastTest }; }
const alive = j => P.config.codomain.indexOf(j) !== -1;

P.on((t, d) => {

/* ---------------- producción ---------------- */
function chutePts(j) { const b = BIN(j); return [[DRUM.x, DRUM.y + 20], [DRUM.x + (b.x - DRUM.x) * .35, DRUM.y + 120], [b.x, 520], [b.x, b.y - 20]]; }
function produce() {
  if (S.run.active) { S.run.scale = 5; return; }
  App.levelStarted(3); S.progress(); if (S.clip.target) S.clip.toggle();
  if (periscope.y !== null) periscope.y = null;
  counters.fill(0);
  const tw = S.run.tw;
  S.run.start((function* () {
    const n = 8;

      const x = k % 2, y = P.f[x], p = makeCritter('src', 0, HOPPER.x, HOPPER.y + 40, speciesFor('SUB2', x)); p.s = .55; pieces.push(p);
      Sound.fam('pop', { vol: .6 });
      Kit.travel(tw, p, [[HOPPER.x, HOPPER.y + 40], [HOPPER.x + 40, 262], [DRUM.x - DRUM.r - 6, 262]], .7, { ease: Ease.linear, done: () => {
        drumTarget = Math.atan2(BIN(y).x - DRUM.x, 200) * -1; Sound.fam('gear');
        Kit.travel(tw, p, [[DRUM.x - DRUM.r, 262], [DRUM.x, DRUM.y]], .2, { done: () => {
          p.species = speciesFor('Z4', y); p.hat = { col: SRC_COL[[0, 2][x]], label: LG(x) }; Sound.fam('transform', { vol: .5 });
          if (!alive(y)) { Kit.travel(tw, p, [[DRUM.x, DRUM.y], [DRUM.x, DRUM.y + 60]], .2, { done: () => { pieces = pieces.filter(q => q !== p); } }); return; }
          Kit.travel(tw, p, chutePts(y), .8, { ease: Ease.in, done: () => {
            pieces = pieces.filter(q => q !== p); counters[y]++; Sound.fam('thud', { vol: .5 }); S.puff(BIN(y).x, BIN(y).y - 10, 4, PAL.bone);
            const r = residents[y]; hopC(r, 14); Kit.react(r, 'relief', 1.2);
          } });
        } });
      } });
      yield .5;
    }
    yield 2;
    produced = true;
    const d = P.diagnose(); S.verdict = d;
    const empties = P.config.codomain.filter(j => counters[j] === 0);
    empties.forEach((j, k) => { const r = residents[j]; Kit.react(r, 'frustration', 2.5); S.later(.4 + k * 2.6, () => S.dir.play(LINES, 'empty', { y: j }, { cooldown: 0, force: true })); });
    if (!empties.length && P.evaluate().done) {
      yield 1.2;
      S.complete({ imagen: { G: 'SUB2', H: 'Z4', f: P.f, from: 'máquina 3, antes de triturar' }, sobreyectividad: { G: 'SUB2', H: 'Z4', f: P.f, from: 'máquina 3, antes de triturar' },

    }
  })(), 'produce');
}
function hopC(c, h) { S.tw.add(c, { hop: h }, .15, { ease: Ease.out, done: () => S.tw.add(c, { hop: 0 }, .2, { ease: Ease.in }) }); }

/* ---------------- periscopio, etiquetas, probador, trituradora ---------------- */
function peek(j) {
  if (!alive(j)) return;
  selBin = j; periscope = { y: j, t: 0 }; peeked = true; S.progress(); Sound.fam('servo');
  const pre = P.preimages(j);
  App.announce('Periscopio del ' + LH(j) + ': ' + (pre.length ? 'llegan ' + pre.map(LG).join(' y ') : 'no llega nadie de la tolva'));

}
function tag(j) { if (!alive(j)) return; P.tag(j); App.announce((P.config.tags.indexOf(j) !== -1 ? 'Marcado' : 'Desmarcado') + ' el contenedor ' + LH(j)); }
function test() {
  if (S.run.active) return;
  if (!P.config.tags.length) { S.say('reg', 'No hay nada marcado. Nada que comprobar.'); return; }
  const r = P.test(); lastTest = r; S.progress(); regTape = []; permit = 0;
  const tw = S.run.tw;
  S.run.start((function* () {
    Sound.fam('servo'); regLight = 0;

    if (r.visited.length) {
      const y = r.visited[0]; regTape.push({ text: '✗ el ' + LH(y) + ' recibe visitas', ok: false }); regLight = -1; Sound.fam('fail');
      Kit.react(residents[y], 'anger', 2.5); S.dir.play(LINES, 'testFailVisited', { y: LH(y), n: counters[y] || '?' }, { force: true }); shred.alto = 2; shred.mood = 'sad'; shred.moodT = 2;

        const ra = residents[c.a], rb = residents[c.b];

        const b = BIN(c.c); Kit.travel(tw, out, [[REG.x, REG.y + 200], [(REG.x + b.x) / 2, 360], [b.x, b.y - 30]], 1.1, { ease: Ease.inOut });

}

/* ---------------- escena ---------------- */
const goals = () => { const e = P.evaluate(), seen = produced; return [
  { text: 'las sumas sobreviven', ok: e.d.analysis.hom, seen },
  { text: 'el destino sigue siendo un grupo', ok: e.d.analysis.codomainReport.ok, seen },
  { text: 'ningún contenedor sin visitas', ok: seen && e.d.analysis.surjective && P.config.codomain.every(j => counters[j] > 0), seen }]; };
const scene = {
  enter() {

  pointerDown(p) { S.kbd = false; S.cancel('intro'); S.progress(); const it = S.hit(items(), p); if (it) it.act(); else { selBin = null; periscope.y = null; } },
  pointerMove(p) { S.pointer = { x: p.x, y: p.y, inside: true }; const it = S.hit(items(), p); S.hoverId = it ? it.id : null; App.setCursor(it ? 'pointer' : 'default'); },
  pointerUp() {}, pointerLeave() { S.pointer.inside = false; },
  key(e) {
    if (S.navKey(e, items())) return true;
    const k = e.key.toLowerCase();
    if (k === 'r') { produce(); return true; }
    if (k === 'p') { test(); return true; }
    if (k === 't') { doShred(); return true; }
    if (k === 'm' && selBin !== null) { tag(selBin); return true; }
    if (/^[0-3]$/.test(k)) { peek(+k); return true; }
    if (k === 'z' || (e.ctrlKey && k === 'z')) { if (!P.undo().ok) S.say('shred', 'Nada que deshacer. Como mis bocados.'); return true; }

  hint: () => S.giveHint(), busy: () => S.run.active, skip: () => S.run.skip(),
  tableContext: () => { const hl = {}; if (lastTest && lastTest.run.failure && lastTest.run.failure.kind === 'closure') hl.Z4 = { r: lastTest.run.failure.a, c: lastTest.run.failure.b }; return { groups: [HH], highlight: hl, note: 'Lo que quede debe ser cerrado: fila y columna dentro, resultado dentro.' }; },
};
const debug = { P, S, shred, counters, produce, peek, tag, test, doShred, items, lastTest: () => lastTest,
  fast() { for (let i = 0; i < 6000 && (S.run.active || S.timers.length); i++) scene.update(1 / 30); }, step(s) { for (let i = 0; i < s * 30; i++) scene.update(1 / 30); } };

<script>

const LINES = {

  diff: [

  neutralYes: [[['mirror', '{y} no cambia a nadie: {y} ⊙ x = x. Es el NEUTRO de este mundo.']]],
  neutralNo: [[['mirror', '{y} cambia a alguien: no es el neutro.']]],
  parade: [[['op', '¡Desfile! Todos de dos en dos.']], [['mirror', 'Dieciséis parejas, dieciséis reflejos.']]],
  paradeOk: [[['mirror', 'Las dieciséis parejas se reflejan sin una sola grieta.']]],

/* ---------------- estado de escena ---------------- */
const walkers = G.labels.map((_, x) => { const c = makeCritter('src', x, MX(x), FLOOR, speciesFor('Z4', x)); c.s = .9; c.hx = c.x; c.hy = c.y; return c; });
let onWalk = [], tokens = [], flipAnim = [0, 0, 0, 0], cracks = [0, 0, 0, 0], wobble = 1, walked = false, lastDiag = null, beam = Spring(0), panA = null, panB = null, showNeutral = null, walkT = 0, certified = false, scaleText = null;
const reflect = G.labels.map((_, x) => { const c = makeCritter('dst', x, MX(x), 380, speciesFor('MIRROR', P.config.faces[x])); c.s = .9; return c; });
function hintState() { const d = P.diagnose(); return { walked, identityOk: d.analysis.identityOk, diag: d }; }

P.on((t, d) => {
  S.progress(); certified = false;
  if (S.run.active) { S.run.kill(); tokens = []; }
  if (d.label === 'flip') { const x = d.result.x; flipAnim[x] = 1; Sound.fam('glass'); S.later(.12, () => Sound.fam('slide')); cracks[x] = 0; S.dir.play(LINES, 'flip', {}, { cooldown: 7 }); }

/* ---------------- interacción ---------------- */
function board(x) {

  App.announce('En la pasarela: ' + onWalk.map(LG).join(' y ') + (onWalk.length === 2 ? '. Pulsa PASEAR.' : '. Elige otro.'));
}
function flip(x) { if (S.run.active) S.run.kill(); P.flip(x); App.announce('El espejo del ' + LG(x) + ' muestra ahora ' + LH(P.config.faces[x])); }
function neutralProbe(x) {

  S.dir.play(LINES, r.every(q => q.same) ? 'neutralYes' : 'neutralNo', { y: LH(y) }, { force: true, cooldown: 0 });

function walk() {

  if (onWalk.length < 2) { S.say('op', 'Hacen falta dos en la pasarela. Clic en dos habitantes.'); return; }

  walked = true; S.progress(); if (S.clip.target) S.clip.toggle();

    // los dos suben a la pasarela

    ta.s = tb.s = .78; tokens.push(ta, tb);

    // ruta ●: sus reflejos salen de los espejos a la vez

    walkT = 1; Sound.fam('hum');

    Kit.travel(tw, tb, [[PLAT[1].x, WALK.y - 4], [ARCH.x + 24, WALK.y - 4]], 1.3, { ease: Ease.inOut });

function drawRoom() {

  ctx.fillStyle = '#d7d8e8'; ctx.fillRect(-1200, -800, W + 2400, 1250);

<script>

<script>
/* ---- scene6.js ---- */
/* THE ALGEBRA ENGINE — Nivel 6: la torre de ascensores.
 * Escena vertical más alta que la pantalla. Abajo, el reloj de 4 espera en cuatro ascensores; arriba, los andenes de U(5),
 * donde se multiplica. Cada polea decide a qué andén lleva su cable. SUBIR transforma; BAJAR intenta deshacer el viaje.
 * El regreso sólo encaja si nadie comparte andén y nadie queda vacío; y la vuelta también tiene que conservar. */
'use strict';

      { who: 'asm', text: 'Mire cuántos acaban en cada andén.' }] },
    { topic: 'neutro', when: s => s.diag.kind === 'broken' && P.config.floors[0] !== HH.identity, tiers: [
      { text: 'El comprobador dice dónde se separan las rutas. Empiece por el 0.' },

      { who: 'asm', text: 'El 0 debe subir al andén 1: 1 × y = y.', point: () => ({ x: SX(0), y: PUL.y }) }] },
    { topic: 'roto', when: s => s.diag.kind === 'broken', tiers: [

  pulley: [[['op', 'Cambio de cable. ¡Ñiiic!']], [['op', 'Esta polea chirría. Le pongo grasa… mañana.']], [['asm', 'Otro andén, otra cuenta.']]],
  share: [[['asm', 'Dos en el andén {y}: el {a} y el {b}.'], ['op', 'Así se hacen compañía.'], ['asm', 'Y yo no sabré a quién devolver.']]],
  emptyPlat: [[['asm', 'El andén {y} no recibe a nadie. Su cable de vuelta baja vacío.']]],
  dizzy: [[['asm', '¿El {a} o el {b}? ¿El {b} o el {a}? Me… mareo…'], ['op', 'Yo bajo por las escaleras.']], [['asm', 'Dos cables, una cabina. Imposible deshacer esto.']]],
  backOk: [[['asm', 'Ida y vuelta, sin dudar. Cada cable baja a su ascensor.']]],
  inverse: [[['asm', 'Y lo más bonito: también la vuelta conserva. Multiplicar arriba es sumar abajo.']]],
  broken: [[['op', 'Las cuentas no cuadran. ¿Pruebo a darle una patada?'], ['asm', 'Pruebe a mirar el comprobador.']], [['asm', 'Arriba y abajo no se ponen de acuerdo en ese par.']]],
};

/* ---------------- estado de escena ---------------- */
const cars = G.labels.map((_, x) => ({ x, y: CAR_BOT, w: 0 }));

const natives = HH.labels.map((_, j) => { const c = makeCritter('dst', j, PX(j), TOP.y - 4, speciesFor('U5', j)); c.s = .85; return c; });
let up = false, climbed = false, returned = false, lastDiag = null, ropeGlow = [0, 0, 0, 0], ropeWob = [0, 0, 0, 0], pulAng = P.config.floors.map(y => y * Math.PI / 2), stuck = [], dizzyRope = null;
function hintState() { return { climbed, returned, diag: P.diagnose() }; }

P.on((t, d) => {
  S.progress(); returned = false;
  if (S.run.active) { S.run.kill(); }
  if (d.label === 'floor') { const x = d.result.x; ropeWob[x] = 1; Sound.fam('gear'); S.later(.1, () => Sound.fam('gear')); S.dir.play(LINES, 'pulley', {}, { cooldown: 8 }); }
  if (d.label === 'undo' || d.label === 'reset') Sound.whoosh();

  if (up) { up = false; cars.forEach(c => { c.y = CAR_BOT; }); riders.forEach(r => { r.x = r.home.x; r.y = r.home.y; r.species = speciesFor('Z4', r.v); r.hat = null; r.ride = null; r.at = null; }); }

/* ---------------- subir ---------------- */
function ropePts(x, y) { const a = { x: SX(x), y: PUL.y - 36 }, b = { x: PX(y), y: TOP.y + 26 }, sag = 30; const pts = []; for (let k = 0; k <= 14; k++) { const t = k / 14; pts.push([U.lerp(a.x, b.x, t), U.lerp(a.y, b.y, t) + Math.sin(t * Math.PI) * sag]); } return pts; }

  cars.forEach(c => { c.y = CAR_BOT; }); riders.forEach(r => { r.x = r.home.x; r.y = r.home.y; r.species = speciesFor('Z4', r.v); r.hat = null; r.at = null; });
  S.run.start((function* () {
    S.cam.follow = () => ({ x: W / 2, y: Math.min(...cars.map(c => c.y)) + 120 });
    Sound.fam('hum');
    cars.forEach((c, x) => { tw.add(c, { y: CAR_BOT + 10 }, .15, { delay: x * .2, ease: Ease.out, done: () => tw.add(c, { y: CAR_TOP }, 1.7, { ease: Ease.inOut, done: () => { Sound.fam('bell', { vol: .6 }); } }) }); });

    const counts = HH.labels.map(() => 0);
    for (let x = 0; x < G.n; x++) {
      const r = riders[x], y = f[x], k = counts[y]++, slot = plSlot(y, k + 1);

        r.species = speciesFor('U5', y); r.hat = { col: SRC_COL[x], label: LG(x) }; Sound.fam('transform'); S.puff(slot.x, slot.y - 30, 5, PAL.bone);
        const mates = riders.filter(q => q !== r && q.at === y); r.at = y;

      const c = d.counterexample;
      S.slip = Kit.RouteSlip(G, HH, f, c.a, c.b, { x: 440, y: 650, title: 'ARRIBA Y ABAJO NO CUADRAN EN ' + LG(c.a) + ' + ' + LG(c.b) });
      Sound.fam('fail'); operarioDo(op, 'facepalm', 2); S.dir.play(LINES, 'broken', {}, { force: true });
      return;
    }
    if (d.collision) { const [a, b] = d.collision.xs; S.dir.play(LINES, 'share', { y: LH(d.collision.y), a: LG(a), b: LG(b) }, { force: true }); }
    else if (d.empty.length) S.dir.play(LINES, 'emptyPlat', { y: LH(d.empty[0]) }, { force: true });
    else { asm.sing = 1.4; Sound.fam('clickin'); S.say('asm', 'Cada uno en su andén. Ahora, BAJAR.'); }
  })(), 'climb', () => riders.forEach(r => { r.ride = null; }));
}
riders.forEach(r => { r.at = null; });

/* ---------------- bajar ---------------- */
function descend() {
  if (S.run.active) { S.run.scale = 5; return; }
  if (!up) { S.say('asm', 'Primero hay que subir. No se deshace un viaje que no se ha hecho.'); return; }
  const d = P.diagnose(), f = P.config.floors, back = P.descend(), tw = S.run.tw;
  S.progress(); stuck = []; dizzyRope = null;
  if (d.kind === 'broken') { S.say('asm', 'Con las cuentas rotas no bajo a nadie. Arregle primero el par del comprobador.'); return; }
  S.run.start((function* () {
    S.cam.goto(W / 2, 450);
    asm.dir = -1; Sound.fam('hum');
    // los andenes con un solo pasajero bajan sin dudar; con dos, la cabina duda
    const ok = [], bad = [];
    back.forEach(b => { if (b.from.length === 1) ok.push(b); else if (b.from.length > 1) bad.push(b); });
    for (const b of ok) {
      const x = b.from[0], r = riders[x];
      ropeGlow[x] = 1;
      Kit.travel(tw, r, [[r.x, r.y]].concat(ropePts(x, b.y).slice().reverse().map(p => [p[0], p[1] + 40])), 1.1, { ease: Ease.inOut, done: () => { r.species = speciesFor('Z4', x); r.hat = null; r.ride = cars[x]; Sound.fam('transform'); Sound.tone(392 * Math.pow(2, x / 6), .22, { type: 'triangle', vol: .1 }); } });
      yield .3;
    }
    for (const b of bad) {
      const [a, c] = b.from; stuck.push(...b.from); dizzyRope = { y: b.y, from: b.from, t: 0 };
      b.from.forEach(x => { Kit.react(riders[x], 'confused', 3); riders[x].shake = .5; });
      asm.dizzy = 3; Sound.fam('fail');
      S.dir.play(LINES, 'dizzy', { a: LG(a), b: LG(c) }, { force: true });
    }
    yield 1.3;
    if (bad.length) {
      S.cam.goto(W / 2, 450);
      S.verdict = d; return;
    }
    // todos en su cabina: bajan a la vez, simétricos
    S.cam.follow = () => ({ x: W / 2, y: Math.max(...cars.map(c => c.y)) - 100 });
    cars.forEach((c, x) => tw.add(c, { y: CAR_BOT }, 1.6, { ease: Ease.inOut, delay: x * .1 }));
    yield 1.9;
    riders.forEach(r => { r.ride = null; r.x = r.home.x; r.y = r.home.y; Kit.react(r, 'relief', 2); r.at = null; });
    up = false; S.cam.follow = null;
    // canción palíndroma: subir y bajar suenan igual
    asm.sing = 3; asm.dir = 1;
    [523, 659, 784, 1046, 784, 659, 523].forEach((fq, i) => Sound.tone(fq, .2, { type: i % 2 ? 'triangle' : 'sine', vol: .12, delay: i * .1 }));
    S.dir.play(LINES, 'backOk', {}, { force: true });
    yield 2.2;
    S.cam.goto(W / 2, 520);
    // la vuelta también conserva: comprobador en sentido inverso
    const inv = []; f.forEach((y, x) => { inv[y] = x; });
    const u = HH.idx('2'), v = HH.idx('3');
    S.slip = Kit.RouteSlip(HH, G, inv, u, v, { x: 440, y: 650, title: 'LA VUELTA TAMBIÉN CONSERVA (arriba ×, abajo +)', reverse: true });
    S.dir.play(LINES, 'inverse', {}, { force: true, delay: .6 });
    yield 4;
    returned = true;
    const ev = P.evaluate(); S.verdict = d;
    if (ev.done) S.complete({ isomorfismo: { G: 'Z4', H: 'U5', f: f.slice(), from: 'máquina 6' } }, 'APROBADO: sube y baja sin dudar, y la vuelta conserva. Isomorfismo entre Z4 y U(5). Vuelva a la fábrica (Esc).');
  })(), 'descend');
}

/* ---------------- controles ---------------- */
function cycle(x) { if (S.run.active) S.run.kill(); const y = (P.config.floors[x] + 1) % HH.n; P.setFloor(x, y); App.announce('La polea del ' + LG(x) + ' lleva ahora al andén ' + LH(y)); }
function items() {
  const out = S.hudItems();
  G.labels.forEach((_, x) => out.push({ id: 'pulley' + x, r: 44, x: SX(x), y: PUL.y, label: 'Polea del ascensor ' + LG(x) + ': andén ' + LH(P.config.floors[x]) + ' (clic: siguiente)', act: () => cycle(x), hoverOutline: true, pri: 1 }));
  out.push({ id: 'climb', screen: true, x: 1390, y: 690, w: 180, h: 44, label: 'SUBIR (U)', act: climb, pri: 1 });
  out.push({ id: 'descend', screen: true, x: 1390, y: 746, w: 180, h: 44, label: 'BAJAR (B)', act: descend, pri: 1 });
  out.push({ id: 'goTop', screen: true, x: 1560, y: 110, w: 30, h: 360, label: 'Ir arriba (W)', act: () => S.cam.goto(W / 2, 450), pri: 3, nofocus: true });
  out.push({ id: 'goBot', screen: true, x: 1560, y: 470, w: 30, h: 200, label: 'Ir abajo (S)', act: () => S.cam.goto(W / 2, WORLD.h - 450), pri: 3, nofocus: true });
  return out;
}

/* ---------------- dibujo ---------------- */
function drawTower() {
  ctx.fillStyle = '#e5c29a'; ctx.fillRect(-1200, -800, W + 2400, WORLD.h + 1600);
  if (App.grain) { ctx.fillStyle = App.grain; ctx.fillRect(-1200, -800, W + 2400, WORLD.h + 1600); }
  // cielo raso con vigas y la planta alta
  ctx.fillStyle = '#c7c9df'; ctx.fillRect(-1200, -800, W + 2400, TOP.y + 840);
  for (let x = -1120; x < W + 1200; x += 160) Draw.line(x, 0, x + 40, TOP.y + 40, 2, 9000 + x, 'rgba(93,96,128,.25)');
  Draw.text('PLANTA ALTA · U(5): aquí se MULTIPLICA (módulo 5)', 110, 190, { size: 18, align: 'left', color: '#3d4170' });
  // ladrillos de la torre
  for (let y = TOP.y + 60; y < GROUND; y += 60) for (let x = (y / 60) % 2 ? -1200 : -1160; x < W + 1200; x += 80) Draw.rrect(x + 4, y + 4, 72, 52, 3, null, 1, 9100 + x + y, 'rgba(33,28,51,.08)');
  Deco.room(S.T, { lamps: [430, 690, 950, 1210], ceil: -60, len: 0, reach: 300, a: .14, clock: [1420, 720, 28], posters: [
    [1210, 790, 170, 126, 'ASCENSOR', ['capacidad:', '1 habitante', 'por andén'], { stripe: '#b8322a', rot: -.03 }],
    [1240, 990, 160, 120, 'RECUERDE', ['abajo se SUMA', 'arriba se', 'MULTIPLICA'], { stripe: '#3d4170', rot: .025 }]] });
  // andenes
  HH.labels.forEach((_, j) => {
    Draw.rrect(PX(j) - 110, TOP.y + 10, 220, 22, 4, '#8d5a2f', 3, 9200 + j);
    Draw.line(PX(j) - 90, TOP.y + 32, PX(j) - 110, TOP.y + 90, 4, 9210 + j); Draw.line(PX(j) + 90, TOP.y + 32, PX(j) + 110, TOP.y + 90, 4, 9220 + j);
    Draw.text('ANDÉN ' + LH(j), PX(j), TOP.y + 50, { size: 14, font: FONT.plate });
    if (j === HH.identity) Draw.text('neutro: 1 × y = y', PX(j), TOP.y + 70, { size: 14, color: PAL.plum });
    const n = natives[j]; n.x = PX(j) - 76; n.y = TOP.y + 6; drawCritter(n);
  });
  // cables aéreos (la función)
  const f = P.config.floors;
  G.labels.forEach((_, x) => {
    const pts = ropePts(x, f[x]), shared = f.filter(v => v === f[x]).length > 1;
    const wob = Math.sin(S.T * 18) * ropeWob[x] * 10;
    const pp = pts.map((p, k) => [p[0], p[1] + Math.sin(k / 14 * Math.PI) * wob]);
    if (ropeGlow[x] > 0) Draw.curve(pp, 10 + ropeGlow[x] * 8, 'rgba(251,239,220,' + ropeGlow[x] * .8 + ')');
    Draw.curve(pp, 4, shared ? PAL.bad : PAL.ink); Draw.curve(pp, 2, SRC_COL[x]);
  });
  if (dizzyRope) { const t = dizzyRope.t, sw = Math.sin(t * 8) * .5 + .5, y = dizzyRope.y; const a = dizzyRope.from[0], b = dizzyRope.from[1]; const pa = Kit.polyAt(ropePts(a, y), .85), pb = Kit.polyAt(ropePts(b, y), .85); const px = U.lerp(pa.x, pb.x, sw), py = U.lerp(pa.y, pb.y, sw); Draw.rrect(px - 22, py - 10, 44, 30, 5, '#c7c2a8', 2.5, 9300); Draw.text('?', px, py + 5, { size: 20, font: FONT.title, color: PAL.bad }); }
  // poleas (el control)
  G.labels.forEach((_, x) => {
    const cx = SX(x), cy = PUL.y;
    Draw.ellipse(cx, cy, 40, 40, PAL.mustard, 3, 9400 + x, S.kbd && S.focusId === 'pulley' + x ? PAL.ultra : PAL.ink);
    for (let k = 0; k < 4; k++) { const a = pulAng[x] + k * Math.PI / 2; Draw.line(cx, cy, cx + Math.cos(a) * 34, cy + Math.sin(a) * 34, 3, 9410 + k); }
    Draw.ellipse(cx, cy, 14, 14, PAL.bone, 2.5, 9420 + x);
    drawBead(speciesFor('U5', f[x]), cx + 52, cy - 14, 13);
    Draw.text('→ andén', cx + 52, cy + 12, { size: 13, color: PAL.inkSoft });
  });
  // huecos de ascensor
  G.labels.forEach((_, x) => {
    const cx = SX(x);
    Draw.rrect(cx - 50, PUL.y + 40, 100, GROUND - PUL.y - 40, 6, 'rgba(58,49,80,.18)', 3, 9500 + x);
    Draw.line(cx - 42, PUL.y + 40, cx - 42, GROUND, 2.5, 9510 + x); Draw.line(cx + 42, PUL.y + 40, cx + 42, GROUND, 2.5, 9520 + x);
    const c = cars[x];
    Draw.line(cx, PUL.y + 30, cx, c.y - 40, 2.5, 9530 + x);
    // contrapeso: baja cuando la cabina sube
    const cw = PUL.y + 60 + (CAR_BOT - c.y) * .9 + 60;
    Draw.line(cx + 30, PUL.y + 30, cx + 30, cw, 1.5, 9540 + x); Draw.rrect(cx + 22, cw, 16, 46, 3, '#6f6a55', 2, 9550 + x);
    Draw.rrect(cx - 40, c.y - 40, 80, 100, 8, '#c99a5e', 3, 9560 + x); Draw.line(cx - 40, c.y - 22, cx + 40, c.y - 22, 2, 9570 + x);
    Draw.text(LG(x), cx, c.y + 72, { size: 16, font: FONT.title });
  });
  // planta baja
  ctx.fillStyle = PAL.paper; ctx.fillRect(-1200, GROUND, W + 2400, WORLD.h - GROUND + 800);
  Draw.line(-1200, GROUND, W + 1200, GROUND, 5, 9600);
  Deco.floor(-1200, W + 1200, GROUND, 400);
  Draw.text('PLANTA BAJA · el reloj de 4: aquí se SUMA', 330, GROUND + 50, { size: 18, align: 'left', color: PAL.inkSoft });
  // ensamblador: la polea maestra
  drawAssembler(asm, ASM.x - 90, ASM.x + 90, ASM.y);
  Draw.text('POLEA MAESTRA', ASM.x, ASM.y + 58, { size: 12, font: FONT.plate });
  drawOperario(op, -4);
  riders.forEach(r => { if (r.ride) { r.x = SX(r.v); r.y = r.ride.y + 38; } drawCritter(r); Kit.drawMark(r); });
  S.drawParts();
}
function drawElevatorMap() {
  const x = 1575, y0 = 110, y1 = 670, sc = (y1 - y0) / WORLD.h;
  Draw.rrect(x - 12, y0 - 6, 24, y1 - y0 + 12, 8, 'rgba(251,239,220,.85)', 2, 9700);
  Draw.ellipse(x, y0 + TOP.y * sc, 4, 4, '#3d4170', 0, 9701); Draw.ellipse(x, y0 + GROUND * sc, 4, 4, PAL.inkSoft, 0, 9702);
  const vy = y0 + (S.cam.y - H / 2) * sc, vh = H * sc;
  Draw.rrect(x - 9, vy, 18, vh, 4, 'rgba(43,71,209,.15)', 2, 9703, PAL.ultra);
  Draw.text('▲', x, y0 - 18, { size: 14, color: PAL.inkSoft }); Draw.text('▼', x, y1 + 18, { size: 14, color: PAL.inkSoft });
}

/* ---------------- escena ---------------- */
let dragCam = null;
const goals = () => { const d = P.diagnose(), seen = climbed; return [
  { text: 'las sumas sobreviven (arriba: producto)', ok: seen && d.analysis.hom, seen },
  { text: 'nadie comparte andén', ok: seen && d.analysis.injective, seen },
  { text: 'ningún andén vacío', ok: seen && d.analysis.surjective, seen },
  { text: 'la vuelta también conserva', ok: returned, seen: returned }]; };
const scene = {
  enter() {
    window.__L6 = debug; S.cam.goto(W / 2, WORLD.h - 450); S.cam.snap();
    S.encIn('Orden nº 6: la torre. Que suban y que puedan bajar sin perder a nadie.', { leaveAfter: 8 });
    S.later(4.5, () => { S.cam.goto(W / 2, 450); S.say('asm', 'Desde aquí arriba lo controlo todo. Bueno, casi todo.'); }, 'intro');
    S.later(9, () => { S.say('op', 'Yo me quedo abajo. Me da vértigo.'); }, 'intro');
  },
  exit() { if (window.__L6 === debug) window.__L6 = null; },
  update(dt) {
    S.update(dt); updateAssembler(asm, dt); updateOperario(op, dt);
    ropeGlow = ropeGlow.map(v => Math.max(0, v - dt)); ropeWob = ropeWob.map(v => Math.max(0, v - dt * 1.5));
    const f = P.config.floors; pulAng = pulAng.map((a, x) => a + (f[x] * Math.PI / 2 - a) * Math.min(1, dt * 8));
    if (dizzyRope) dizzyRope.t += dt;
    riders.forEach(r => Kit.live(r, dt, { x: W / 2, y: TOP.y }));
    natives.forEach(n => Kit.live(n, dt, { x: W / 2, y: GROUND }));
  },
  render() {
    ctx.save(); S.cam.apply(ctx); drawTower(); ctx.restore();
    Draw.text('THE ALGEBRA ENGINE · MÁQUINA 6', 34, 26, { size: 15, font: FONT.plate, align: 'left', color: PAL.inkSoft, spacing: 2 });
    Draw.text('El ensamblador reversible', 32, 54, { size: 30, font: FONT.title, align: 'left', jitter: 1.2, seed: 39 });
    drawElevatorMap();
    Draw.rrect(1370, 670, 220, 140, 8, '#8d5a2f', 3, 9800);
    Kit.plate(1390, 690, 180, 44, 'SUBIR', { fill: '#dfe8c8', focus: S.kbd && S.focusId === 'climb' });
    Kit.plate(1390, 746, 180, 44, 'BAJAR', { fill: up ? '#e9d6f0' : '#d8d2c8', color: up ? PAL.ink : PAL.inkSoft, focus: S.kbd && S.focusId === 'descend' });
    S.drawHud(goals());
    S.drawFocus(items());
  },
  pointerDown(p) { S.kbd = false; S.cancel('intro'); S.progress(); const it = S.hit(items(), p); if (it) { it.act(); return; } dragCam = { y: p.y, cy: S.cam.ty }; },
  pointerMove(p) { S.pointer = { x: p.x, y: p.y, inside: true }; if (dragCam) { S.cam.goto(W / 2, dragCam.cy - (p.y - dragCam.y)); S.cam.snap(); App.setCursor('grabbing'); return; } const it = S.hit(items(), p); S.hoverId = it ? it.id : null; App.setCursor(it ? 'pointer' : 'grab'); },
  pointerUp() { dragCam = null; }, pointerLeave() { S.pointer.inside = false; dragCam = null; },
  key(e) {
    const k = e.key.toLowerCase();
    if (k === 'w') { S.cam.goto(W / 2, S.cam.ty - 300); return true; }
    if (k === 's') { S.cam.goto(W / 2, S.cam.ty + 300); return true; }
    if (S.navKey(e, items())) return true;
    if (k === 'u' || k === 'r') { climb(); return true; }
    if (k === 'b') { descend(); return true; }
    if (/^[0-3]$/.test(k)) { cycle(+k); return true; }
    if (k === 'z' || (e.ctrlKey && k === 'z')) { if (!P.undo().ok) S.say('op', 'Nada que deshacer.'); return true; }
    if (k === 'n') { P.reset(); return true; }
    return false;
  },
  hint: () => S.giveHint(), busy: () => S.run.active, skip: () => S.run.skip(),
  tableContext: () => ({ groups: [G, HH], highlight: S.slip ? S.slip.highlights() : {}, note: 'Arriba se multiplica módulo 5: la fila del 1 repite la cabecera.' }),
};
const debug = { P, S, climb, descend, cycle, items, up: () => up, returned: () => returned, stuck: () => stuck,
  fast() { for (let i = 0; i < 6000 && (S.run.active || S.timers.length); i++) scene.update(1 / 30); }, step(s) { for (let i = 0; i < s * 30; i++) scene.update(1 / 30); } };
scene.debug = () => debug;
return scene;
};

<script>
/* ---- scene7.js ---- */
/* THE ALGEBRA ENGINE — Nivel 7: el caso de los gemelos imposibles (rediseño, iteración 6).
 * Un caso de detective en tres pasos, siempre a la vista en el EXPEDIENTE:
 *   1 · MEDIR VUELTAS — clic en un habitante: la noria de su mundo lo combina consigo mismo hasta que vuelve a casa
 *       y cuenta los pasos (su orden). Cada medida cae en la HUELLA de su mundo (cuántos tardan 1, 2, 3 o 4 pasos).
 *   2 · PROBAR EL PUENTE — si existiera la traducción, ¿adónde iría el 1? Como el 1 lo decide todo
 *       (f(2) = f(1)∘f(1)…), basta probar los cuatro gemelos: todos chocan.
 *   3 · INFORME — cuatro líneas que siguen el razonamiento; cada hueco cambia con un clic y se comprueba con lo medido. */
'use strict';
window.LabScene = function (App) {
const W = 1600, H = 900, ctx = Draw.ctx, AG = AlgebraGroups;
const P = AG.createCase();
const G = P.G, HH = P.H;
const JAR = {

  H: { x: 1350, y: 455, r: 158, K: HH, name: 'LOS GEMELOS DE KLEIN', note: 'a∘a = e · a∘b = c', tint: 'rgba(199,201,223,.55)' },
};
const NORIA = side => ({ x: JAR[side].x, y: 712 });
const BOARD = { x: 470, y: 78, w: 660, h: 580 };
const FP = { x: BOARD.x + 24, y: BOARD.y + 150, w: BOARD.w - 48, h: 150 };
const REPORT = { x: BOARD.x + 24, y: BOARD.y + 336 };
const STAMP = { x: BOARD.x + BOARD.w - 196, y: BOARD.y + BOARD.h - 56, w: 176, h: 42 };
const BR = { x: 470, y: 690, w: 660, h: 190 };
const SEL = y => ({ x: BR.x + 70 + y * 62, y: BR.y + 92 });
const OUT = x => ({ x: BR.x + 360 + x * 72, y: BR.y + 92 });

const op = makeOperario(1190, 806);
const S = Kit.base(App, 7, {
  order: '¿Se puede traducir el reloj de 4 a los gemelos de Klein sin perder nada? Mida, pruebe y redacte el informe. Pruebas, no presentimientos.',
  groups: () => [G, HH], clipAt: { x: 26, y: 84 }, ticketAt: { x: 1200, y: 600 }, stampAt: { x: 800, y: 470 },
  cast: {

    G0: { pos: () => crit('G', 0), voice: 0 }, G1: { pos: () => crit('G', 1), voice: 1 }, G2: { pos: () => crit('G', 2), voice: 2 }, G3: { pos: () => crit('G', 3), voice: 3 },
    H0: { pos: () => crit('H', 0), voice: 0 }, H1: { pos: () => crit('H', 1), voice: 1 }, H2: { pos: () => crit('H', 2), voice: 2 }, H3: { pos: () => crit('H', 3), voice: 3 },
  },
  state: () => hintState(),
  hints: [
    { topic: 'medir', when: s => s.stage === 1, tiers: [
      { text: 'Paso 1: haga clic en un habitante. La noria lo combina consigo mismo hasta que vuelve a casa, y cuenta los pasos.', point: () => crit('G', 1) },
      { text: 'Esos pasos son su huella. Mida a los ocho: cuatro del reloj y cuatro gemelos.' },
      { text: t => 'Faltan por medir: ' + t.missing.join(', ') + '.' }] },
    { topic: 'puente', when: s => s.stage === 2, tiers: [
      { text: 'Paso 2: si la traducción existiera, el 1 iría a algún gemelo. Pruebe cada uno en el puente.', point: () => SEL(1) },
      { text: 'El 1 lo decide todo: f(2) = f(1)∘f(1), f(3) = f(2)∘f(1). Mire con quién choca el 2.' },
      { text: t => 'Faltan por probar en el puente: ' + t.untried.join(', ') + '.' }] },
    { topic: 'informe', when: s => s.stage === 3, tiers: [
      { text: 'Paso 3: rellene el informe. Cada hueco cambia con un clic; la marca de la derecha dice si la línea se sostiene.', point: () => ({ x: REPORT.x + 200, y: REPORT.y + 30, screen: true }) },
      { text: t => t.lineHint },
      { text: 'Línea 1: el 1 (o el 3) tarda 4 pasos. Línea 2: ninguno más de 2. Línea 3: conserva. Línea 4: no existe.' }] },
    { topic: 'sello', when: s => s.stage === 4 && !s.stamped, tiers: [{ text: 'El informe se sostiene. Selle IMPOSIBLE.', point: () => ({ x: STAMP.x + 88, y: STAMP.y + 20, screen: true }) }] },
  ],
});
const LINES = {
  four: [[['G{x}', '¡Cuatro pasos para volver al 0!'], ['op', 'Eso es mucho girar. Apuntado en la huella.']], [['G{x}', '¡Uno, dos, tres… y cuatro! ¡En casa!']]],
  twin: [[['H{x}', '¡Yo vuelvo en dos! {l}∘{l} = e.'], ['op', 'Como todos los gemelos, sospecho.']], [['H{x}', 'Dos pasos y en casa.']]],
  home: [[['op', 'El neutro ya está en casa: 1 paso. Ése no cuenta mucho.']]],

  else if (k === 'm') { Sound.setLevel(Sound.muted ? 2 : 0); saveSettings(); App.announce(Sound.muted ? 'Sonido apagado' : 'Sonido encendido'); }
  else if (k === 'l') { settings.reduced = !settings.reduced; saveSettings(); App.announce(settings.reduced ? 'Movimiento reducido' : 'Movimiento completo'); }
  else if (e.key === '-') { Sound.setLevel(Math.max(1, Sound.level - 1)); saveSettings(); }
  else if (e.key === '+' || e.key === '=') { Sound.setLevel(Math.min(3, Sound.level + 1)); saveSettings(); }
  else return;
  e.preventDefault();
});
if (mq && mq.addEventListener) mq.addEventListener('change', e => { if (save.settings.reduced === null) settings.reduced = e.matches; });

/* ================================================================
 * BUCLE
 * ============================================================== */
let grain = null;
function makeGrain() {
  const g = document.createElement('canvas'); g.width = g.height = 220; const gc = g.getContext('2d');
  const id = gc.createImageData(220, 220);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = 80; id.data[i + 1] = 40; id.data[i + 2] = 30; id.data[i + 3] = v < 30 ? 30 : v > 245 ? 22 : 0; }
  gc.putImageData(id, 0, 0);
  grain = ctx.createPattern(g, 'repeat'); App.grain = grain;
}
/* El contenido de cada escena mide 1600×900; alrededor siempre hay al menos 80 de margen lateral
   para el riel de herramientas y el portapapeles. El resto del espacio se rellena con el propio escenario. */
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.max(1, canvas.clientWidth), ch = Math.max(1, canvas.clientHeight);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const s = Math.min(cw / 1760, ch / 900), vw = cw / s, vh = ch / s;
  view = { s, dpr, vw, vh, ox: (vw - W) / 2, oy: (vh - H) / 2 };
  App.view.w = vw; App.view.h = vh; App.view.ox = view.ox; App.view.oy = view.oy;
}
window.addEventListener('resize', resize);
function step(dt) {
  Clock.t += dt; Clock.reduced = settings.reduced;
  Draw.boil = settings.reduced ? 0 : Math.floor(Clock.t * 8) % 3; Draw.wob = settings.reduced ? .4 : 1;
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  notebookPulse = Math.max(0, notebookPulse - dt * .25);
  updateTransition(dt);
  if (overlay) { ovT += dt; return; }
  scene && scene.update(dt);
}
function render() {
  const k = view.s * view.dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = (scene && scene.bg) || PAL.paper; ctx.fillRect(0, 0, view.vw, view.vh);
  if (grain) { ctx.fillStyle = grain; ctx.fillRect(0, 0, view.vw, view.vh); }
  ctx.setTransform(k, 0, 0, k, view.ox * k, view.oy * k);
  ctx.save();
  if (trans) {
    const p = Math.min(1, trans.t / trans.dur), o = trans.o;
    const r = trans.phase === 'out' ? (1 - Ease.in(p)) * 2400 : Ease.out(p) * 2400;
    ctx.save();
    if (trans.phase === 'out' && !settings.reduced) { const z = 1 + Ease.in(p) * .6; ctx.translate(o.x, o.y); ctx.scale(z, z); ctx.translate(-o.x, -o.y); }
    ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(1, r), 0, Math.PI * 2); ctx.clip();
    scene.render();
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(-view.ox - 10, -view.oy - 10, view.vw + 20, view.vh + 20); ctx.arc(o.x, o.y, Math.max(1, r), 0, Math.PI * 2, true); ctx.fillStyle = PAL.ink; ctx.fill('evenodd'); ctx.restore();
  } else scene.render();
  if (isLevel() || sceneId === 'map') { Deco.dust(-view.ox, -view.oy, view.vw, view.vh, Clock.t, settings.reduced ? 0 : 26, .3); Deco.vignette(-view.ox, -view.oy, view.vw, view.vh, isLevel() ? .2 : .14); }
  drawTablePanel();
  drawOverlay();
  ctx.restore();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (!overlay || overlay.kind !== 'brief') drawRail();
}
let last = performance.now();
function frame(now) { const dt = U.clamp((now - last) / 1000, 0, .05); last = now; step(dt); render(); requestAnimationFrame(frame); }

window.__APP = {
  App, save, settings, tableP, toggleTable, get sceneId() { return sceneId; }, get scene() { return scene; }, get overlay() { return overlay; },
  goto: (id, full) => { trans = null; overlay = null; if (scene && scene.exit) scene.exit(); scene = makeScene(id); sceneId = id; scene.enter && scene.enter(); if (full) sceneEntered(id); },
  step(sec) { for (let i = 0; i < sec * 30; i++) step(1 / 30); },
  openOverlay, closeOverlay, persist, reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  view: () => view, globalButtons, Music,
  /** Pruebas: coordenadas de escena → píxeles CSS de la página. */
  toPage(x, y) { const r = canvas.getBoundingClientRect(); return { x: r.left + (x + view.ox) * view.s, y: r.top + (y + view.oy) * view.s }; },
  railToPage(id) { const o = globalButtons().find(b => b.id === id); const r = canvas.getBoundingClientRect(); return o ? { x: r.left + o.x * view.s, y: r.top + o.y * view.s } : null; },
  testMode() { save.comicSeen = true; save.comics = save.comics || {}; for (let i = 1; i <= 8; i++) { save.briefed[i] = true; save.comics[i] = true; } persist(); },
};
const fontsReady = document.fonts && document.fonts.load ? Promise.race([
  Promise.all([document.fonts.load('30px "Chango"'), document.fonts.load('16px "Special Elite"'), document.fonts.load('20px "Patrick Hand"')]),
  new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(boot, boot);
function boot() { resize(); makeGrain(); goto('title'); requestAnimationFrame(frame); }
})();

</script>
