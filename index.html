<title>The Algebra Engine</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Patrick+Hand&family=Special+Elite&display=swap">
<style>
/* Mundo único de papel secante: el juego no cambia con el tema del visor. */
:root {
  --margin: #b9805a;   /* borde de la mesa */
  --ink: #211c33;
  --bone: #fbefdc;
  --font-hand: "Patrick Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--margin); color: var(--ink); overflow: hidden; font-family: var(--font-hand); }
#stage { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#stage:focus-visible { outline: none; } /* el foco se dibuja dentro del mundo */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#rotate { position: fixed; inset: auto 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px; padding: 8px 12px; background: var(--bone); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 10px; font-size: 18px; text-align: center; display: none; }
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
</style>
<canvas id="stage" tabindex="0" aria-label="The Algebra Engine: una fábrica de puzles. Tab recorre los objetos, Enter actúa, R ejecuta la máquina, H pide una pista, Z deshace, Esc abre el menú, C abre el cuaderno."></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<div id="rotate">Gira el teléfono: la máquina es ancha.</div>
<script>
/* ---- core.js ---- */
/* THE ALGEBRA ENGINE — núcleo matemático y estado lógico.
 * Sin dependencias del DOM. Esta es la única fuente de verdad matemática:
 * el render sólo dibuja lo que este módulo calcula.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AlgebraCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------------------------------------------------------------
   * 1. ESTRUCTURAS
   * ------------------------------------------------------------- */

  /** Conjunto con operación "suma módulo mod". Si elements no es {0..mod-1}
   *  la estructura puede no ser cerrada: eso se detecta, no se oculta. */
  function additiveStructure(elements, mod, name) {
    if (!Number.isInteger(mod) || mod < 1) throw new Error('módulo inválido: ' + mod);
    const els = elements.slice();
    return {
      name: name || ('({' + els.join(',') + '}, +' + mod + ')'),
      elements: els,
      mod: mod,
      op: function (a, b) { return mod_(a + b, mod); },
      has: function (x) { return els.indexOf(x) !== -1; }
    };
  }

  function mod_(x, n) { return ((x % n) + n) % n; }

  /** Grupo cíclico Z_n = ({0..n-1}, +n). */
  function Zn(n) {
    const els = [];
    for (let i = 0; i < n; i++) els.push(i);
    return additiveStructure(els, n, 'Z' + n);
  }

  /** Pares (a,b) cuyo resultado se sale del conjunto. */
  function closureFailures(S) {
    const out = [];
    for (const a of S.elements) for (const b of S.elements) {
      const r = S.op(a, b);
      if (!S.has(r)) out.push({ a: a, b: b, result: r });
    }
    return out;
  }

  /** Comprobación completa de axiomas de grupo (conjunto finito). */
  function groupReport(S) {
    const closure = closureFailures(S);
    const closed = closure.length === 0;
    let assoc = true;
    if (closed) {
      for (const a of S.elements) for (const b of S.elements) for (const c of S.elements)
        if (S.op(S.op(a, b), c) !== S.op(a, S.op(b, c))) assoc = false;
    }
    let identity = null;
    for (const e of S.elements) {
      if (S.elements.every(function (x) { return S.op(e, x) === x && S.op(x, e) === x; })) { identity = e; break; }
    }
    let inverses = identity !== null && S.elements.every(function (x) {
      return S.elements.some(function (y) { return S.op(x, y) === identity && S.op(y, x) === identity; });
    });
    return { closed: closed, closure: closure, associative: assoc, identity: identity,
      inverses: inverses, isGroup: closed && assoc && identity !== null && inverses };
  }

  /* ---------------------------------------------------------------
   * 2. FUNCIONES Y VERIFICADOR
   * ------------------------------------------------------------- */

  /** f se representa como un array: f[x] = imagen o null (sin imagen). */
  function fromFunction(G, fn) { return G.elements.map(function (x) { return fn(x); }); }

  /** Verifica f: G → H sobre TODOS los pares ordenados (|G|² pares).
   *  Ruta A: combinar en G, luego transformar.  f(a +G b)
   *  Ruta B: transformar por separado, luego combinar en H.  f(a) +H f(b)
   */
  function checkHomomorphism(G, H, f) {
    const missing = G.elements.filter(function (x) { return f[x] === null || f[x] === undefined; });
    const outOfRange = G.elements.filter(function (x) { return f[x] !== null && f[x] !== undefined && !H.has(f[x]); });
    const total = missing.length === 0 && outOfRange.length === 0;
    const hGroup = groupReport(H);
    const pairs = [];
    for (const a of G.elements) for (const b of G.elements) {
      const sumG = G.op(a, b);
      const imgA = f[sumG];
      const fa = f[a], fb = f[b];
      const aDefined = imgA !== null && imgA !== undefined;
      const bDefined = fa !== null && fa !== undefined && fb !== null && fb !== undefined;
      const sumH = bDefined ? H.op(fa, fb) : null;
      let status;
      if (!aDefined || !bDefined) status = 'undefined';
      else if (!H.has(sumH)) status = 'escape';           // el resultado no vive en H
      else status = (imgA === sumH) ? 'ok' : 'fail';
      // 'escape' también es un desacuerdo real entre rutas (o un H no cerrado)
      pairs.push({ a: a, b: b, sumG: sumG, routeA: aDefined ? imgA : null,
        fa: bDefined ? fa : (fa === undefined ? null : fa), fb: bDefined ? fb : (fb === undefined ? null : fb),
        routeB: sumH, status: status, ok: status === 'ok' });
    }
    const allOk = pairs.every(function (p) { return p.ok; });
    const isHom = total && hGroup.isGroup && allOk;

    // Propiedades de la función (sólo con sentido si es total)
    let injective = false, surjective = false, collisions = [], kernel = [], image = [];
    if (total) {
      const byImage = {};
      for (const x of G.elements) (byImage[f[x]] = byImage[f[x]] || []).push(x);
      image = Object.keys(byImage).map(Number).sort(function (a, b) { return a - b; });
      collisions = image.filter(function (y) { return byImage[y].length > 1; })
        .map(function (y) { return { image: y, sources: byImage[y] }; });
      injective = collisions.length === 0;
      surjective = H.elements.every(function (y) { return byImage[y] !== undefined; });
      const idH = hGroup.identity;
      kernel = idH === null ? [] : G.elements.filter(function (x) { return f[x] === idH; });
    }
    const bijective = injective && surjective;
    return {
      total: total, missing: missing, outOfRange: outOfRange,
      target: hGroup, pairs: pairs, checkedPairs: pairs.length,
      allPairsAgree: allOk, isHomomorphism: isHom,
      injective: injective, surjective: surjective, bijective: bijective,
      isIsomorphism: isHom && bijective,
      collisions: collisions, kernel: kernel, image: image,
      counterexample: usefulCounterexample(pairs)
    };
  }

  /** El contraejemplo más didáctico: primero los que implican al neutro
   *  (0+0), luego por suma más pequeña. Ignora pares indefinidos. */
  function usefulCounterexample(pairs) {
    const bad = pairs.filter(function (p) { return p.status === 'fail' || p.status === 'escape'; });
    if (!bad.length) return null;
    bad.sort(function (p, q) {
      const k = function (r) { return (r.a === 0 && r.b === 0 ? -100 : 0) + (r.a + r.b) * 10 + r.a; };
      return k(p) - k(q);
    });
    return bad[0];
  }

  /* ---------------------------------------------------------------
   * 3. ESTADO LÓGICO DEL NIVEL ("La máquina que se comió el cuatro")
   *
   * Gramática de reglas (pequeña y sin ambigüedad):
   *   El riel tiene 4 ranuras con muesca de forma distinta. Cada ranura
   *   acepta sólo bloques de su tipo. Una regla está ACTIVA ⇔ está encajada.
   *     motor  ← ARRANCA      (sin él la palanca está trabada)
   *     total  ← TODO         (cada elemento debe tener imagen)
   *     puerta ← COMPARTIDO | EXCLUSIVO   (política de destinos; obligatoria para ejecutar)
   *     ley    ← CONSERVA     (la máquina compara Ruta A y Ruta B)
   *   El cartel del mundo de destino es la frase "AQUÍ SE SUMA MÓD [ficha]".
   *   La ficha (2 ó 4) es obligatoria para ejecutar. Las fichas retiradas
   *   se las come la máquina (quedan en su barriga, visible por la ventanilla).
   * ------------------------------------------------------------- */

  const BLOCKS = {
    ARRANCA:    { slot: 'motor',  text: ['LA MÁQUINA', 'ARRANCA'] },
    TODO:       { slot: 'total',  text: ['TODO', 'TIENE IMAGEN'] },
    COMPARTIDO: { slot: 'puerta', text: ['DESTINO', 'COMPARTIDO'] },
    EXCLUSIVO:  { slot: 'puerta', text: ['DESTINO', 'EXCLUSIVO'] },
    CONSERVA:   { slot: 'ley',    text: ['CONSERVA', 'LA SUMA'] }
  };
  const SLOTS = ['motor', 'total', 'puerta', 'ley'];

  function initialConfig() {
    return {
      slots: { motor: null, total: 'TODO', puerta: 'EXCLUSIVO', ley: 'CONSERVA' },
      tray: ['ARRANCA', 'COMPARTIDO'],
      chip: 4,          // la máquina copió el 4 del origen sin pensar
      belly: [2],       // el 2 está dentro de la máquina
      map: [null, null, null, null],
      plugOrder: [0, 0, 0, 0],
      plugCounter: 0
    };
  }

  function clone(c) { return JSON.parse(JSON.stringify(c)); }

  function createLevel() {
    const G = Zn(4);
    let cfg = initialConfig();
    const history = [];
    const listeners = [];

    function emit(type, data) { for (const l of listeners) l(type, data || {}); }
    function commit(label, mutate) {
      const before = clone(cfg);
      const result = mutate(cfg);
      if (result && result.rejected) { cfg = before; return result; }
      history.push({ label: label, cfg: before });
      if (history.length > 200) history.shift();
      emit('change', { label: label, result: result || {} });
      return result || { ok: true };
    }

    function target() { return additiveStructure([0, 1], cfg.chip || 1, 'H'); }

    function sharersOf(c, y) { return [0, 1, 2, 3].filter(function (x) { return c.map[x] === y; }); }

    /** Aplica la regla EXCLUSIVO al estado: expulsa a los que llegaron después. */
    function enforceExclusive(c) {
      const evicted = [];
      if (c.slots.puerta !== 'EXCLUSIVO') return evicted;
      for (const y of [0, 1]) {
        const s = sharersOf(c, y).sort(function (p, q) { return c.plugOrder[p] - c.plugOrder[q]; });
        for (let i = 1; i < s.length; i++) { c.map[s[i]] = null; evicted.push({ x: s[i], y: y, keeper: s[0] }); }
      }
      return evicted;
    }

    const api = {
      G: G,
      BLOCKS: BLOCKS, SLOTS: SLOTS,
      get config() { return cfg; },
      target: target,
      on: function (fn) { listeners.push(fn); },
      canUndo: function () { return history.length > 0; },

      plug: function (x, y) {
        if (!(x >= 0 && x < 4) || !(y === 0 || y === 1)) return { rejected: true, reason: 'invalid' };
        if (cfg.map[x] === y) return { ok: true, noop: true };
        if (cfg.slots.puerta === 'EXCLUSIVO') {
          const occ = sharersOf(cfg, y).filter(function (o) { return o !== x; });
          if (occ.length) return { rejected: true, reason: 'exclusive', occupant: occ[0] };
        }
        return commit('plug', function (c) {
          c.map[x] = y; c.plugOrder[x] = ++c.plugCounter;
          const sharers = sharersOf(c, y);
          return { ok: true, x: x, y: y, shared: sharers.length > 1 ? sharers : null };
        });
      },
      unplug: function (x) {
        if (cfg.map[x] === null) return { ok: true, noop: true };
        return commit('unplug', function (c) { const y = c.map[x]; c.map[x] = null; return { ok: true, x: x, y: y }; });
      },
      /** Encaja un bloque en su ranura. Si estaba ocupada, intercambia. */
      insertBlock: function (id, slot) {
        const b = BLOCKS[id];
        if (!b) return { rejected: true, reason: 'unknown' };
        slot = slot || b.slot;
        if (b.slot !== slot) return { rejected: true, reason: 'shape', id: id, slot: slot };
        if (cfg.slots[slot] === id) return { ok: true, noop: true };
        return commit('insert', function (c) {
          const prev = c.slots[slot];
          c.tray = c.tray.filter(function (t) { return t !== id; });
          for (const s of SLOTS) if (c.slots[s] === id) c.slots[s] = null;
          c.slots[slot] = id;
          if (prev) c.tray.push(prev);
          const evicted = enforceExclusive(c);
          return { ok: true, id: id, slot: slot, swapped: prev, evicted: evicted };
        });
      },
      removeBlock: function (id) {
        const slot = SLOTS.filter(function (s) { return cfg.slots[s] === id; })[0];
        if (!slot) return { ok: true, noop: true };
        return commit('remove', function (c) { c.slots[slot] = null; c.tray.push(id); return { ok: true, id: id, slot: slot }; });
      },
      /** Pone una ficha (desde la barriga) en el cartel; la anterior se la come la máquina. */
      setChip: function (n) {
        if (cfg.chip === n) return { ok: true, noop: true };
        if (cfg.belly.indexOf(n) === -1) return { rejected: true, reason: 'nochip' };
        return commit('chip', function (c) {
          const prev = c.chip;
          c.belly = c.belly.filter(function (k) { return k !== n; });
          if (prev !== null) c.belly.push(prev);
          c.chip = n;
          return { ok: true, chip: n, eaten: prev };
        });
      },
      removeChip: function () {
        if (cfg.chip === null) return { ok: true, noop: true };
        return commit('chip', function (c) { const p = c.chip; c.belly.push(p); c.chip = null; return { ok: true, eaten: p }; });
      },
      undo: function () {
        if (!history.length) return { ok: false };
        const h = history.pop();
        cfg = h.cfg;
        emit('change', { label: 'undo', undone: h.label, result: {} });
        return { ok: true, undone: h.label };
      },
      /** Reiniciar también se puede deshacer: nunca se pierde un experimento. */
      reset: function () {
        return commit('reset', function (c) {
          const fresh = initialConfig();
          for (const k in fresh) c[k] = fresh[k];
          return { ok: true };
        });
      },

      /** Fija un estado sin historial (secuencias narrativas). Notifica para que el mundo lo anime. */
      setRaw: function (c, label) {
        cfg = clone(c);
        emit('change', { label: label || 'raw', result: {} });
      },
      clearHistory: function () { history.length = 0; },

      /** Comprobaciones de gramática antes de ejecutar. */
      preflight: function () {
        const problems = [];
        if (cfg.slots.motor !== 'ARRANCA') problems.push('motor');
        if (cfg.chip === null) problems.push('chip');
        if (!cfg.slots.puerta) problems.push('puerta');
        return { ok: problems.length === 0, problems: problems };
      },

      /** Ejecuta la máquina: devuelve un informe puramente lógico. */
      run: function () {
        const pre = api.preflight();
        if (!pre.ok) return { ran: false, preflight: pre };
        const H = target();
        const f = cfg.map.slice();
        const rules = {
          total: cfg.slots.total === 'TODO',
          conserve: cfg.slots.ley === 'CONSERVA',
          exclusive: cfg.slots.puerta === 'EXCLUSIVO'
        };
        const check = checkHomomorphism(G, H, f);
        let verdict;
        if (rules.total && !check.total) verdict = 'incomplete';
        else if (!rules.conserve) verdict = check.total ? 'unchecked' : 'partial-unchecked';
        else if (!check.total) verdict = 'uncertifiable';
        else if (check.isHomomorphism) verdict = 'homomorphism';
        else verdict = 'broken';
        const order = {
          sums: verdict === 'homomorphism',
          visits: check.total && check.surjective,
        };
        order.done = order.sums && order.visits;
        return { ran: true, f: f, chip: cfg.chip, rules: rules, check: check, verdict: verdict, order: order,
          signature: JSON.stringify([f, cfg.chip, cfg.slots]) };
      },

      /** Intenta invertir la máquina para una imagen y: ¿de dónde vino? */
      reverse: function (y) {
        const sources = cfg.map.map(function (v, x) { return v === y ? x : -1; }).filter(function (x) { return x >= 0; });
        return { y: y, sources: sources, unique: sources.length === 1 };
      }
    };
    return api;
  }

  return {
    mod: mod_, Zn: Zn, additiveStructure: additiveStructure,
    closureFailures: closureFailures, groupReport: groupReport,
    fromFunction: fromFunction, checkHomomorphism: checkHomomorphism,
    usefulCounterexample: usefulCounterexample,
    BLOCKS: BLOCKS, SLOTS: SLOTS, initialConfig: initialConfig, createLevel: createLevel
  };
});

</script>
<script>
/* ---- groups.js ---- */
/* THE ALGEBRA ENGINE — grupos finitos genéricos, verificadores y estado de los niveles 2–8.
 * Sin DOM. Los elementos son índices 0..n-1 con etiquetas; la operación es una tabla de Cayley.
 * Nada aquí supone que la identidad se llama "0".
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AlgebraGroups = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* =============================================================
   * 1. GRUPOS
   * =========================================================== */
  function makeGroup(key, name, labels, opIdx, symbol) {
    const n = labels.length, table = [];
    for (let i = 0; i < n; i++) { table.push([]); for (let j = 0; j < n; j++) table[i].push(opIdx(i, j)); }
    const G = { key, name, labels: labels.slice(), n, table, symbol: symbol || '+',
      op: (i, j) => table[i][j], idx: lab => labels.indexOf(String(lab)) };
    const rep = groupAxioms(G);
    if (!rep.isGroup) throw new Error(key + ' no es un grupo: ' + JSON.stringify(rep.failure));
    G.identity = rep.identity;
    G.inverse = i => { for (let j = 0; j < n; j++) if (table[i][j] === G.identity) return j; return null; };
    return G;
  }
  /** Comprueba los axiomas con testigo del primer fallo. */
  function groupAxioms(G, subset) {
    const S = subset || G.labels.map((_, i) => i), inS = x => S.indexOf(x) !== -1;
    if (!S.length) return { isGroup: false, failure: { kind: 'empty' } };
    for (const a of S) for (const b of S) { const c = G.table[a][b]; if (!inS(c)) return { isGroup: false, failure: { kind: 'closure', a, b, c } }; }
    for (const a of S) for (const b of S) for (const c of S)
      if (G.table[G.table[a][b]][c] !== G.table[a][G.table[b][c]]) return { isGroup: false, failure: { kind: 'assoc', a, b, c } };
    let e = null;
    for (const x of S) if (S.every(y => G.table[x][y] === y && G.table[y][x] === y)) { e = x; break; }
    if (e === null) return { isGroup: false, failure: { kind: 'identity' } };
    for (const a of S) if (!S.some(b => G.table[a][b] === e && G.table[b][a] === e)) return { isGroup: false, failure: { kind: 'inverse', a }, identity: e };
    return { isGroup: true, identity: e };
  }
  /** ¿Es S ⊆ G un subgrupo (con la identidad de G)? */
  function subgroupReport(G, S) {
    if (!S.length) return { ok: false, failure: { kind: 'empty' } };
    if (S.indexOf(G.identity) === -1) return { ok: false, failure: { kind: 'identity', e: G.identity } };
    const r = groupAxioms(G, S);
    return r.isGroup ? { ok: true } : { ok: false, failure: r.failure };
  }
  function orderOf(G, i) {
    let x = i, k = 1;
    while (x !== G.identity) { x = G.op(x, i); k++; if (k > G.n + 1) return Infinity; }
    return k;
  }
  /** Potencias x, x∘x, … hasta volver a la identidad (para la máquina de órdenes). */
  function powers(G, i) {
    const out = [i]; let x = i;
    while (x !== G.identity && out.length <= G.n) { x = G.op(x, i); out.push(x); }
    return out;
  }
  function orderProfile(G) { return G.labels.map((_, i) => orderOf(G, i)).sort((a, b) => a - b); }

  const Z = n => makeGroup('Z' + n, 'Z' + n, Array.from({ length: n }, (_, i) => String(i)), (i, j) => (i + j) % n, '+');
  const GROUPS = {
    Z2: Z(2), Z4: Z(4), Z8: Z(8),
    // {0,2} ⊂ Z4 como grupo por derecho propio (etiquetas reales 0 y 2, suma módulo 4)
    SUB2: makeGroup('SUB2', '{0, 2} ⊂ Z4', ['0', '2'], (i, j) => ((i * 2 + j * 2) % 4) / 2, '+'),
    // Mundo espejo: {0,1} con a⊙b = 1 si a = b. Su identidad es el "1".
    MIRROR: makeGroup('MIRROR', 'Espejo', ['0', '1'], (i, j) => (i === j ? 1 : 0), '⊙'),
    // Unidades módulo 5 con el producto
    U5: makeGroup('U5', 'U(5)', ['1', '2', '3', '4'], (i, j) => [1, 2, 3, 4].indexOf(((i + 1) * (j + 1)) % 5), '×'),
    // Grupo de Klein
    V4: makeGroup('V4', 'V4', ['e', 'a', 'b', 'c'], (i, j) => i ^ j, '∘'),
  };

  /* =============================================================
   * 2. FUNCIONES ENTRE GRUPOS
   * =========================================================== */
  /** Análisis completo de f: G → H (f[i] = índice en H o null), con codominio opcional C ⊆ H. */
  function analyze(G, H, f, codomain) {
    const C = codomain || H.labels.map((_, i) => i), inC = y => C.indexOf(y) !== -1;
    const def = x => f[x] !== null && f[x] !== undefined;
    const missing = [], outside = [];
    for (let x = 0; x < G.n; x++) { if (!def(x)) missing.push(x); else if (!inC(f[x])) outside.push(x); }
    const total = missing.length === 0 && outside.length === 0;
    const codomainReport = subgroupReport(H, C);
    const pairs = [];
    for (let a = 0; a < G.n; a++) for (let b = 0; b < G.n; b++) {
      const s = G.op(a, b), A = def(s) ? f[s] : null;
      const B = def(a) && def(b) ? H.op(f[a], f[b]) : null;
      let status = A === null || B === null ? 'undefined' : A === B ? 'ok' : 'fail';
      pairs.push({ a, b, sumG: s, routeA: A, fa: def(a) ? f[a] : null, fb: def(b) ? f[b] : null, routeB: B, status, ok: status === 'ok' });
    }
    const allOk = pairs.every(p => p.ok);
    const hom = total && allOk;
    const byImg = {};
    for (let x = 0; x < G.n; x++) if (def(x)) (byImg[f[x]] = byImg[f[x]] || []).push(x);
    const image = Object.keys(byImg).map(Number).sort((a, b) => a - b);
    const collisions = image.filter(y => byImg[y].length > 1).map(y => ({ y, xs: byImg[y] }));
    const unreached = C.filter(y => !byImg[y]);
    const injective = total && collisions.length === 0;
    const surjective = total && unreached.length === 0;
    const kernel = G.labels.map((_, x) => x).filter(x => f[x] === H.identity);
    const kernelTrivial = total && kernel.length === 1 && kernel[0] === G.identity;
    const identityOk = def(G.identity) && f[G.identity] === H.identity;
    let inverseHom = false;
    if (hom && injective && surjective && codomainReport.ok) {
      const inv = {}; for (let x = 0; x < G.n; x++) inv[f[x]] = x;
      inverseHom = C.every(u => C.every(v => inv[H.op(u, v)] === G.op(inv[u], inv[v])));
    }
    const groupOk = codomainReport.ok;
    return {
      total, missing, outside, pairs, checkedPairs: pairs.length, hom,
      counterexample: usefulCounterexample(pairs, G),
      kernel, kernelTrivial, image, imageIsSubgroup: subgroupReport(H, image).ok,
      collisions, unreached, injective, surjective, identityOk,
      codomain: C.slice(), codomainReport,
      // en la categoría de grupos: mono ⇔ homomorfismo inyectivo; epi ⇔ homomorfismo sobreyectivo
      mono: hom && injective, epi: hom && surjective && groupOk,
      iso: hom && injective && surjective && groupOk, inverseHom,
    };
  }
  function usefulCounterexample(pairs, G) {
    const bad = pairs.filter(p => p.status === 'fail');
    if (!bad.length) return null;
    const e = G ? G.identity : 0;
    const key = p => (p.a === e && p.b === e ? -1000 : 0) + (p.a === e || p.b === e ? -100 : 0) + p.a * 10 + p.b;
    return bad.sort((p, q) => key(p) - key(q))[0];
  }
  function permutations(arr) {
    if (arr.length <= 1) return [arr.slice()];
    const out = [];
    arr.forEach((x, i) => permutations(arr.slice(0, i).concat(arr.slice(i + 1))).forEach(p => out.push([x].concat(p))));
    return out;
  }
  function allHoms(G, H) {
    const out = [], f = Array(G.n).fill(0);
    const rec = k => { if (k === G.n) { if (analyze(G, H, f).hom) out.push(f.slice()); return; } for (let y = 0; y < H.n; y++) { f[k] = y; rec(k + 1); } };
    rec(0); return out;
  }
  function isomorphisms(G, H) {
    if (G.n !== H.n) return [];
    return permutations(H.labels.map((_, i) => i)).filter(p => analyze(G, H, p).iso);
  }

  /* =============================================================
   * 3. DEFINICIONES DE NIVEL (fuente de verdad de cada objetivo)
   * =========================================================== */
  const L = lab => lab;  // las etiquetas se convierten a índices al crear el puzle
  const LEVELS = {
    1: { name: 'La máquina que se comió el cuatro', machine: 'traductora', concept: 'homomorfismo' },
    2: { name: 'La garra del núcleo', machine: 'garra', concept: 'núcleo y monomorfismo',
      G: 'Z4', H: 'Z4', initial: ['0', '2', '0', '2'],
      goals: ['hom', 'kernelTrivial'],
      order: 'Que la garra no encuentre nada en el núcleo salvo la identidad, sin romper las sumas.' },
    3: { name: 'La trituradora de destinos', machine: 'trituradora', concept: 'imagen, sobreyectividad y epimorfismo',
      G: 'SUB2', H: 'Z4', initial: ['0', '2'], mapLocked: true, shredder: true,
      goals: ['hom', 'codomainGroup', 'surjective'],
      order: 'Que ningún destino se quede sin visitas. El cable está soldado: sólo se puede tocar el destino.' },
    4: { name: 'El espejo de las identidades', machine: 'espejo', concept: 'f(e) = e',
      G: 'Z4', H: 'MIRROR', initial: ['0', '1', '0', '1'],
      goals: ['hom', 'surjective'], showIdentity: true,
      order: 'Traducir el reloj de 4 al mundo espejo sin romper las sumas, visitando a los dos.' },
    5: { name: 'La fábrica de copias', machine: 'copias', concept: 'inyectividad y sobreyectividad',
      machines: [
        { name: 'COPIADORA A', G: 'Z4', H: 'Z2', f: ['0', '1', '0', '1'] },
        { name: 'COPIADORA B', G: 'Z2', H: 'Z4', f: ['0', '2'] },
        { name: 'COPIADORA C', G: 'Z4', H: 'Z4', f: ['0', '1', '3', '2'] },
      ],
      order: 'Rellenar el parte de cada copiadora: ¿conserva la suma? ¿inyectiva? ¿sobreyectiva?' },
    6: { name: 'El ensamblador reversible', machine: 'ensamblador', concept: 'isomorfismo',
      G: 'Z4', H: 'U5', initial: ['1', '4', '1', '4'],
      goals: ['hom', 'injective', 'surjective', 'inverseHom'],
      order: 'Que la máquina pueda ir y volver sin perder a nadie, conservando la operación.' },
    7: { name: 'Los gemelos imposibles', machine: 'gemelos', concept: 'orden de los elementos',
      G: 'Z4', H: 'V4', initial: ['e', 'a', 'b', 'c'],
      order: 'Conectar el reloj de 4 con los gemelos de Klein mediante un isomorfismo. (O demostrar que no se puede.)' },
    8: { name: 'El corazón de la fábrica', machine: 'corazon', concept: 'síntesis',
      G: 'Z4', H: 'Z8', initial: ['0', '4', '0', '4'], shredder: true,
      goals: ['hom', 'kernelTrivial', 'codomainGroup', 'surjective', 'iso'],
      order: 'Que el corazón traduzca el reloj de 4 sin perder a nadie y sin destinos vacíos: reversible en los dos sentidos.' },
  };
  const GOAL_TEXT = {
    hom: 'las sumas sobreviven (16 pares)', kernelTrivial: 'en el núcleo sólo la identidad', injective: 'nadie comparte destino',
    surjective: 'ningún destino sin visitas', codomainGroup: 'el destino sigue siendo un grupo', inverseHom: 'el camino de vuelta también conserva',
    iso: 'reversible: es un isomorfismo', identity: 'el neutro va al neutro: f(e) = e',
  };

  /* =============================================================
   * 4. ESTADO DE UN NIVEL DE BANCO DE TRABAJO (2, 3, 4, 6, 8)
   * =========================================================== */
  function history(initial) {
    let cfg = JSON.parse(JSON.stringify(initial));
    const past = [], listeners = [];
    return {
      get cfg() { return cfg; },
      on: fn => listeners.push(fn),
      emit: (t, d) => listeners.forEach(l => l(t, d || {})),
      commit(label, mutate) {
        const before = JSON.parse(JSON.stringify(cfg));
        const r = mutate(cfg) || { ok: true };
        if (r.rejected) { cfg = before; return r; }
        past.push(before); if (past.length > 200) past.shift();
        this.emit('change', { label, result: r }); return r;
      },
      undo() { if (!past.length) return { ok: false }; cfg = past.pop(); this.emit('change', { label: 'undo', result: {} }); return { ok: true }; },
      canUndo: () => past.length > 0,
      reset() { return this.commit('reset', c => { const fresh = JSON.parse(JSON.stringify(initial)); for (const k in fresh) c[k] = fresh[k]; return { ok: true }; }); },
    };
  }

  function createPuzzle(id) {
    const def = LEVELS[id], G = GROUPS[def.G], H = GROUPS[def.H];
    const init = { map: def.initial.map(l => H.idx(l)), codomain: H.labels.map((_, i) => i) };
    const h = history(init);
    const api = {
      id, def, G, H, on: h.on,
      get config() { return h.cfg; },
      canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      plug(x, y) {
        if (def.mapLocked) return { rejected: true, reason: 'locked' };
        if (h.cfg.codomain.indexOf(y) === -1) return { rejected: true, reason: 'shredded' };
        if (h.cfg.map[x] === y) return { ok: true, noop: true };
        return h.commit('plug', c => { c.map[x] = y; return { ok: true, x, y }; });
      },
      unplug(x) {
        if (def.mapLocked) return { rejected: true, reason: 'locked' };
        if (h.cfg.map[x] === null) return { ok: true, noop: true };
        return h.commit('unplug', c => { const y = c.map[x]; c.map[x] = null; return { ok: true, x, y }; });
      },
      /** La trituradora valida ANTES de triturar: lo que queda debe ser un subgrupo que contenga la imagen. */
      checkShred(list) {
        if (!def.shredder) return { ok: false, reason: 'noshredder' };
        const cod = h.cfg.codomain, rest = cod.filter(y => list.indexOf(y) === -1);
        const reached = list.filter(y => h.cfg.map.indexOf(y) !== -1);
        if (!list.length) return { ok: false, reason: 'nothing' };
        if (reached.length) return { ok: false, reason: 'reached', reached };
        const sg = subgroupReport(H, rest);
        if (!sg.ok) return { ok: false, reason: 'subgroup', failure: sg.failure, rest };
        return { ok: true, rest };
      },
      shred(list) {
        const r = api.checkShred(list);
        if (!r.ok) return Object.assign({ rejected: true }, r);
        return h.commit('shred', c => { c.codomain = r.rest; return { ok: true, shredded: list.slice(), rest: r.rest }; });
      },
      evaluate() {
        const c = h.cfg, A = analyze(G, H, c.map, c.codomain);
        const val = {
          hom: A.hom, kernelTrivial: A.kernelTrivial, injective: A.injective, surjective: A.surjective,
          codomainGroup: A.codomainReport.ok, inverseHom: A.inverseHom, iso: A.iso, identity: A.identityOk,
        };
        const goals = def.goals.map(k => ({ key: k, text: GOAL_TEXT[k], ok: !!val[k] }));
        return { analysis: A, goals, done: goals.every(g => g.ok), map: c.map.slice(), codomain: c.codomain.slice() };
      },
      reverse(y) {
        const xs = h.cfg.map.map((v, x) => v === y ? x : -1).filter(x => x >= 0);
        return { y, sources: xs, unique: xs.length === 1 };
      },
    };
    return api;
  }

  /* =============================================================
   * 5. NIVEL 5 — diagnóstico de tres copiadoras
   * =========================================================== */
  const PROPS = ['hom', 'injective', 'surjective'];
  function createCopies() {
    const def = LEVELS[5];
    const machines = def.machines.map(m => {
      const G = GROUPS[m.G], H = GROUPS[m.H], f = m.f.map(l => H.idx(l));
      const A = analyze(G, H, f);
      return { name: m.name, G, H, f, analysis: A, truth: { hom: A.hom, injective: A.injective, surjective: A.surjective } };
    });
    const h = history({ diag: machines.map(() => ({ hom: null, injective: null, surjective: null })), tested: machines.map(() => ({ hom: false, injective: false, surjective: false })) });
    const api = {
      id: 5, def, machines, on: h.on, PROPS,
      get config() { return h.cfg; },
      canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      /** Ejecutar una herramienta sobre una copiadora (experimento real). */
      test(m, prop) {
        const M = machines[m], A = M.analysis;
        let detail;
        if (prop === 'hom') detail = { pairs: A.pairs, counterexample: A.counterexample };
        if (prop === 'injective') detail = { collisions: A.collisions };
        if (prop === 'surjective') detail = { unreached: A.unreached };
        if (!h.cfg.tested[m][prop]) h.commit('test', c => { c.tested[m][prop] = true; return { ok: true, m, prop }; });
        return Object.assign({ m, prop, value: M.truth[prop] }, detail);
      },
      setDiag(m, prop, value) { return h.commit('diag', c => { c.diag[m][prop] = value; return { ok: true, m, prop, value }; }); },
      evaluate() {
        const rows = machines.map((M, m) => PROPS.map(p => ({ prop: p, set: h.cfg.diag[m][p], truth: M.truth[p], ok: h.cfg.diag[m][p] === M.truth[p] })));
        const done = rows.every(r => r.every(c => c.ok));
        return { rows, done, wrong: rows.flatMap((r, m) => r.filter(c => c.set !== null && !c.ok).map(c => ({ m, prop: c.prop }))) };
      },
    };
    return api;
  }

  /* =============================================================
   * 6. NIVEL 7 — Z4 frente a V4
   * =========================================================== */
  function createTwins() {
    const def = LEVELS[7], G = GROUPS[def.G], H = GROUPS[def.H];
    const h = history({ map: def.initial.map(l => H.idx(l)) });
    const measured = { G: {}, H: {} };   // conocimiento adquirido: no se deshace
    const api = {
      id: 7, def, G, H, on: h.on, measured,
      get config() { return h.cfg; },
      canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      plug(x, y) {
        if (h.cfg.map[x] === y) return { ok: true, noop: true };
        // conectar a un destino ocupado intercambia los cables: siempre una biyección
        return h.commit('plug', c => { const prev = c.map.indexOf(y), old = c.map[x]; c.map[x] = y; if (prev !== -1 && prev !== x) c.map[prev] = old; return { ok: true, x, y, swapped: prev !== -1 && prev !== x ? prev : null }; });
      },
      measure(side, i) {
        const K = side === 'G' ? G : H, o = orderOf(K, i);
        measured[side][i] = o;
        return { side, i, order: o, powers: powers(K, i) };
      },
      evaluate() { return { analysis: analyze(G, H, h.cfg.map), map: h.cfg.map.slice() }; },
      /** Declarar imposible: sólo vale con pruebas que realmente lo demuestren. */
      declareImpossible() {
        const truth = isomorphisms(G, H).length === 0;
        const hMeasured = Object.keys(measured.H).length === H.n;
        const hOrders = Object.values(measured.H);
        const witness = Object.keys(measured.G).map(Number).find(g => hMeasured && hOrders.indexOf(measured.G[g]) === -1);
        if (witness !== undefined && truth) return { ok: true, witness, order: measured.G[witness], hOrders: H.labels.map((_, i) => measured.H[i]) };
        // pruebas insuficientes: decir qué falta, sin dar la respuesta
        const missingH = H.labels.map((_, i) => i).filter(i => measured.H[i] === undefined);
        return { ok: false, reason: missingH.length ? 'measureH' : 'noWitness', missingH, truth };
      },
    };
    return api;
  }

  /* =============================================================
   * 7. DIAGNÓSTICO (iteración 3): cada fallo devuelve información
   * =========================================================== */
  /** a · b⁻¹ en G. Si f(a) = f(b) y f es homomorfismo, f(a·b⁻¹) = e. */
  function difference(G, a, b) { return G.op(a, G.inverse(b)); }
  /** Distingue los cinco casos que el jugador debe poder separar. */
  function diagnose(G, H, f, codomain) {
    const A = analyze(G, H, f, codomain);
    const d = { analysis: A, missing: A.missing, outside: A.outside };
    if (!A.total) { d.kind = 'incomplete'; return d; }
    if (!A.hom) { d.kind = 'broken'; d.counterexample = A.counterexample; return d; }
    d.collision = A.collisions[0] || null;
    if (d.collision) {
      const [a, b] = d.collision.xs, dd = difference(G, b, a);
      d.witness = { a, b, d: dd, fd: f[dd] };      // f(b·a⁻¹) cae en el neutro
    }
    d.empty = A.unreached.slice();
    d.kind = A.iso ? 'iso' : !A.injective && !A.surjective ? 'hom-neither' : !A.injective ? 'hom-noninj' : !A.surjective ? 'hom-nonsurj' : 'iso';
    if (d.kind === 'iso' && !A.codomainReport.ok) d.kind = 'hom-badcodomain';
    return d;
  }
  /** Para G cíclico con generador gen: f(genᵏ) := imgᵏ. Si la vuelta no cierra, se indica dónde. */
  function powerMap(G, H, gen, img) {
    const f = Array(G.n).fill(null);
    let x = G.identity, y = H.identity, k = 0;
    while (f[x] === null && k <= G.n) { f[x] = y; x = G.op(x, gen); y = H.op(y, img); k++; }
    const closes = y === f[x];            // al volver al principio, ¿el destino también vuelve?
    return { f, steps: k, closes, endsAt: y, ord: orderOf(G, gen) };
  }
  /** Lo que comprueba el probador de cierre, par por par, con el primer fallo. */
  function closureRun(H, set) {
    const checks = [];
    if (set.indexOf(H.identity) === -1) return { ok: false, checks, failure: { kind: 'identity', e: H.identity } };
    for (const a of set) for (const b of set) { const c = H.op(a, b); checks.push({ a, b, c, ok: set.indexOf(c) !== -1 }); }
    const bad = checks.find(c => !c.ok);
    if (bad) return { ok: false, checks, failure: { kind: 'closure', a: bad.a, b: bad.b, c: bad.c } };
    const noInv = set.find(a => set.indexOf(H.inverse(a)) === -1);
    if (noInv !== undefined) return { ok: false, checks, failure: { kind: 'inverse', a: noInv } };
    return { ok: true, checks };
  }

  /* =============================================================
   * 8. ESTADOS DE LOS NIVELES REDISEÑADOS (iteración 3)
   *    Todos aceptan CUALQUIER solución que cumpla las condiciones.
   * =========================================================== */
  const isNum = v => v !== null && v !== undefined;
  /* --- Nivel 2: taller de inspección --- */
  function createWorkshop(opts) {
    opts = opts || {};
    const G = GROUPS[opts.G || 'Z4'], H = GROUPS[opts.H || 'Z4'];
    const gen = G.idx('1');
    const h = history({ k: H.idx(opts.k || '2'), coupled: true, manual: null });
    const api = {
      G, H, gen, on: h.on, get config() { return h.cfg; }, canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      map() { const c = h.cfg; return c.coupled ? powerMap(G, H, gen, c.k).f : c.manual.slice(); },
      gear() { return powerMap(G, H, gen, h.cfg.k); },
      setK(y) { if (h.cfg.k === y && h.cfg.coupled) return { ok: true, noop: true }; return h.commit('k', c => { c.k = y; c.coupled = true; c.manual = null; return { ok: true, k: y }; }); },
      decouple() { if (!h.cfg.coupled) return { ok: true, noop: true }; const f = api.map(); return h.commit('decouple', c => { c.coupled = false; c.manual = f; return { ok: true }; }); },
      setManual(x, y) { if (h.cfg.coupled) api.decouple(); if (h.cfg.manual[x] === y) return { ok: true, noop: true }; return h.commit('manual', c => { c.manual[x] = y; return { ok: true, x, y }; }); },
      diagnose() { return diagnose(G, H, api.map()); },
      evaluate() { const d = api.diagnose(), A = d.analysis; const goals = [{ key: 'hom', ok: A.hom }, { key: 'kernelTrivial', ok: A.kernelTrivial }]; return { d, goals, done: goals.every(g => g.ok), map: api.map() }; },
      /** Lupa comparadora: dos piezas del mismo cajón → su diferencia y adónde cae. */
      compare(a, b) { const f = api.map(), dd = difference(G, b, a); return { a, b, d: dd, fa: f[a], fb: f[b], fd: f[dd], same: f[a] === f[b], inKernel: f[dd] === H.identity }; },
    };
    return api;
  }
  /* --- Nivel 3: planta de clasificación --- */
  function createPlant() {
    const G = GROUPS.SUB2, H = GROUPS.Z4, f = [H.idx('0'), H.idx('2')];
    const h = history({ codomain: [0, 1, 2, 3], tags: [], tested: null });
    const api = {
      G, H, f, on: h.on, get config() { return h.cfg; }, canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      preimages(y) { return f.map((v, x) => v === y ? x : -1).filter(x => x >= 0); },
      tag(y) { const c = h.cfg; if (c.codomain.indexOf(y) === -1) return { rejected: true, reason: 'gone' }; return h.commit('tag', c2 => { const i = c2.tags.indexOf(y); if (i === -1) c2.tags.push(y); else c2.tags.splice(i, 1); c2.tags.sort(); c2.tested = null; return { ok: true, y, tagged: i === -1 }; }); },
      /** El probador de cierre trabaja sobre lo que QUEDARÍA. */
      test() {
        const c = h.cfg, rest = c.codomain.filter(y => c.tags.indexOf(y) === -1);
        const visited = c.tags.filter(y => api.preimages(y).length);
        const run = closureRun(H, rest);
        const res = { rest, visited, run, ok: run.ok && !visited.length && c.tags.length > 0 };
        h.commit('test', c2 => { c2.tested = { tags: c2.tags.slice(), ok: res.ok }; return { ok: true }; });
        return res;
      },
      shred() {
        const c = h.cfg;
        if (!c.tags.length) return { rejected: true, reason: 'nothing' };
        if (!c.tested || JSON.stringify(c.tested.tags) !== JSON.stringify(c.tags)) return { rejected: true, reason: 'untested' };
        if (!c.tested.ok) return { rejected: true, reason: 'failed' };
        return h.commit('shred', c2 => { const gone = c2.tags.slice(); c2.codomain = c2.codomain.filter(y => gone.indexOf(y) === -1); c2.tags = []; c2.tested = null; return { ok: true, gone }; });
      },
      diagnose() { return diagnose(G, H, f, h.cfg.codomain); },
      evaluate() { const d = api.diagnose(), A = d.analysis; const goals = [{ key: 'hom', ok: A.hom }, { key: 'codomainGroup', ok: A.codomainReport.ok }, { key: 'surjective', ok: A.surjective }]; return { d, goals, done: goals.every(g => g.ok) }; },
    };
    return api;
  }
  /* --- Nivel 4: sala de espejos --- */
  function createMirrors() {
    const G = GROUPS.Z4, H = GROUPS.MIRROR;
    const h = history({ faces: [H.idx('0'), H.idx('1'), H.idx('0'), H.idx('1')], walks: 0 });
    const api = {
      G, H, on: h.on, get config() { return h.cfg; }, canUndo: h.canUndo, undo: () => h.undo(), reset: () => h.reset(),
      flip(x) { return h.commit('flip', c => { c.faces[x] = 1 - c.faces[x]; return { ok: true, x, y: c.faces[x] }; }); },
      /** Una pareja pasea por la pasarela: las dos rutas, de verdad. */
      walk(a, b) { const f = h.cfg.faces, s = G.op(a, b); return { a, b, s, A: f[s], fa: f[a], fb: f[b], B: H.op(f[a], f[b]), ok: f[s] === H.op(f[a], f[b]) }; },
      neutralTest(y) { return H.labels.map((_, z) => ({ z, r: H.op(y, z), same: H.op(y, z) === z })); },
      diagnose() { return diagnose(G, H, h.cfg.faces); },
      evaluate() { const d = api.diagnose(), A = d.analysis; const goals = [{ key: 'identity', ok: A.identityOk }, { key: 'hom', ok: A.hom }, { key: 'surjective', ok: A.surjective }]; return { d, goals, done: A.hom && A.surjective }; },
    };
    return api;
  }
  /* --- Nivel 6: torre de ascensores --- */

/* ================================================================

 * ============================================================== */
K.drawCayley = function (Gk, x, y, cell, hl, hover) {
  const n = Gk.n, ctx = Draw.ctx, w = cell * (n + 1);

    const inRow = hl && i - 1 === hl.r, inCol = hl && j - 1 === hl.c, isCell = inRow && inCol;
    let fill = i === 0 || j === 0 ? '#ead7b4' : 'rgba(255,255,255,.4)';
    if ((inRow && j > 0) || (inCol && i > 0)) fill = '#f6e27a';
    if (hover && hover.r === i - 1 && hover.c === j - 1) fill = '#e9d6f0';
    ctx.fillStyle = fill; ctx.fillRect(cx, cy, cell, cell); ctx.strokeStyle = PAL.inkFaint; ctx.lineWidth = 1; ctx.strokeRect(cx, cy, cell, cell);
    let lab = '';
    if (i === 0 && j === 0) lab = Gk.symbol; else if (i === 0) lab = Gk.labels[j - 1]; else if (j === 0) lab = Gk.labels[i - 1]; else lab = Gk.labels[Gk.op(i - 1, j - 1)];

/* ================================================================
 * PORTAPAPELES DE LA ORDEN: plegable, sólo lo justo
 * ============================================================== */
K.Clipboard = function (o) {
  const cb = Object.assign({ open: 1, target: 1, hover: false }, o);
  cb.toggle = () => { cb.target = cb.target ? 0 : 1; Sound.fam('slide'); };
  cb.update = dt => { cb.open += (cb.target - cb.open) * Math.min(1, dt * 8); };
  // plegada, la orden se cuelga en el margen izquierdo (fuera del área de juego)
  cb.gx = () => Math.min(cb.x, 8 - ((App.view && App.view.ox) || 0));
  cb.rect = () => cb.open > .5 ? { x: cb.x, y: cb.y, w: 360, h: cb.height || 200 } : { x: cb.gx(), y: cb.y, w: 64, h: 64 };
  cb.draw = function (goals) {
    const ctx = Draw.ctx, y = cb.y; let x = cb.x;
    if (cb.open < .5) {
      x = cb.gx();
      ctx.save(); ctx.translate(x + 30, y + 30); ctx.rotate(-.08);
      Draw.rrect(-24, -28, 48, 58, 4, '#c7a36b', 2.5, 4400); Draw.rrect(-18, -20, 36, 44, 2, PAL.bone, 1.5, 4401); Draw.rrect(-10, -32, 20, 10, 3, '#6f6a55', 2, 4402);
      Draw.line(-12, -8, 12, -8, 1.5, 4403); Draw.line(-12, 0, 8, 0, 1.5, 4404); Draw.line(-12, 8, 10, 8, 1.5, 4405);
      const okN = (goals || []).filter(g => g.ok).length; Draw.text(okN + '/' + (goals || []).length, 0, 40, { size: 13, font: FONT.plate });
      ctx.restore(); return;
    }
    const lines = App.wrap(cb.text, 320, 19), gs = goals || [];
    const h = 56 + lines.length * 22 + gs.length * 28 + 14; cb.height = h;
    const s = (cb.open - .5) * 2;
    ctx.save(); ctx.translate(x, y); ctx.scale(.6 + .4 * s, .6 + .4 * s); ctx.rotate(-.015);
    Draw.rrect(0, 0, 360, h, 4, '#c7a36b', 2.5, 4410); Draw.rrect(8, 14, 344, h - 22, 3, PAL.bone, 2, 4411); Draw.rrect(150, -6, 60, 18, 4, '#6f6a55', 2.5, 4412);
    Draw.text(cb.title, 22, 36, { size: 15, font: FONT.plate, align: 'left' });
    Draw.text('(O)', 340, 36, { size: 13, align: 'right', color: PAL.inkSoft });
    lines.forEach((l, i) => Draw.text(l, 22, 62 + i * 22, { size: 19, align: 'left' }));
    let yy = 62 + lines.length * 22 + 14;
    gs.forEach(g => {
      Draw.rrect(22, yy - 11, 22, 22, 3, PAL.bone, 2, 4420 + yy);
      if (g.ok) Draw.curve([[26, yy], [32, yy + 7], [48, yy - 14]], 4, PAL.good);
      else if (g.seen) { Draw.line(27, yy - 6, 39, yy + 6, 3, 4421 + yy, PAL.bad); Draw.line(39, yy - 6, 27, yy + 6, 3, 4422 + yy, PAL.bad); }
      Draw.text(g.text, 54, yy, { size: 18, align: 'left', color: g.ok ? PAL.good : PAL.ink }); yy += 28;
    });
    ctx.restore();
  };
  return cb;
};

/* ================================================================
 * SONIDO: familias con pequeñas variaciones
 * ============================================================== */
Sound.fam = function (name, o) {
  if (!this.ok()) return;
  o = o || {};
  const j = 1 + (Math.random() - .5) * (o.var === undefined ? .14 : o.var), v = o.vol || 1;
  const T = (f, d, p) => this.tone(f * j, d, Object.assign({}, p, { vol: (p.vol || .2) * v, to: p.to ? p.to * j : undefined }));
  const N = (d, p) => this.noise(d, Object.assign({}, p, { vol: (p.vol || .2) * v, freq: (p.freq || 1000) * j, to: p.to ? p.to * j : undefined }));
  switch (name) {
    case 'gear': N(.04, { freq: 1900, q: 8, vol: .3 }); N(.04, { freq: 1500, q: 8, vol: .25, delay: .06 }); break;
    case 'servo': T(380, .32, { type: 'sawtooth', vol: .05, to: 620, lp: 1500 }); break;
    case 'slide': N(.16, { freq: 700, to: 1200, q: 1.5, vol: .16 }); break;
    case 'drag': N(.08, { freq: 500, to: 700, q: 1, vol: .1 }); break;
    case 'clickin': N(.02, { freq: 4300, q: 10, vol: .45 }); T(1650, .05, { type: 'triangle', vol: .1 }); T(2480, .05, { type: 'sine', vol: .05, delay: .03 }); break;
    case 'thud': N(.14, { freq: 240, to: 80, filter: 'lowpass', vol: .7 }); T(85, .16, { type: 'sine', vol: .25, to: 50 }); break;
    case 'press': N(.1, { freq: 300, q: 1, vol: .5 }); T(70, .26, { type: 'square', vol: .12, lp: 300 }); N(.05, { freq: 3000, q: 4, vol: .2, delay: .12 }); break;
    case 'transform': T(520, .22, { type: 'triangle', vol: .12, to: 1150 }); N(.15, { freq: 5000, filter: 'highpass', vol: .07, delay: .08 }); break;
    case 'collide': N(.08, { freq: 600, q: 2, vol: .6 }); T(170, .18, { type: 'square', vol: .08, to: 110, lp: 900 }); T(880, .12, { type: 'sine', vol: .07, to: 1400, delay: .08 }); break;
    case 'fail': T(220, .42, { type: 'sawtooth', vol: .11, to: 105, lp: 800, vib: 6, vibAmt: 14 }); break;
    case 'grab': N(.05, { freq: 2200, q: 6, vol: .4 }); T(300, .08, { type: 'square', vol: .07, lp: 900 }); break;
    case 'release': T(520, .12, { type: 'triangle', vol: .1, to: 720 }); break;
    case 'bell': T(1318, .7, { type: 'sine', vol: .12 }); T(1976, .5, { type: 'sine', vol: .05 }); break;
    case 'hum': T(110, .8, { type: 'sawtooth', vol: .04, lp: 400, vib: 3, vibAmt: 4 }); break;
    case 'shred': N(.7, { freq: 260, to: 900, q: 2, vol: .45 }); T(55, .7, { type: 'square', vol: .1, lp: 250, vib: 18, vibAmt: 10 }); break;
    case 'glass': T(2093, .5, { type: 'sine', vol: .08 }); T(2637, .35, { type: 'sine', vol: .05, delay: .05 }); break;
    case 'crack': N(.12, { freq: 4000, q: 3, vol: .4 }); N(.08, { freq: 2500, q: 3, vol: .3, delay: .06 }); break;
    case 'boing': T(240, .3, { type: 'sine', vol: .22, to: 680, vib: 14, vibAmt: 40 }); break;
    case 'pop': T(600, .06, { type: 'sine', vol: .22, to: 1200 }); N(.03, { freq: 3000, vol: .18 }); break;
    case 'discover': // firma de descubrimiento: cuatro notas en cuarta ascendente y un brillo
      [659, 880, 1175, 1568].forEach((f, i) => this.tone(f, .55 - i * .06, { type: i % 2 ? 'triangle' : 'sine', vol: .11 * v, delay: i * .1 }));
      this.noise(.4, { freq: 7000, filter: 'highpass', vol: .04 * v, delay: .32 }); break;
    case 'repair': for (let k = 0; k < 5; k++) N(.03, { freq: 2400 + k * 200, q: 8, vol: .3, delay: k * .06 }); [392, 494, 587].forEach((f, i) => this.tone(f, .6, { type: 'triangle', vol: .08 * v, delay: .34 + i * .04 })); break;
    case 'voice': {
      const who = o.who;
      if (who === 'enc') { N(.12, { freq: 3500, q: 1, vol: .12 }); T(160, .18, { type: 'triangle', vol: .08, to: 140, delay: .05 }); }
      else if (who === 'op') this.voice('boss');
      else if (who === 'claw') { T(900, .08, { type: 'square', vol: .04, lp: 2500 }); T(1200, .08, { type: 'square', vol: .04, lp: 2500, delay: .09 }); }
      else if (who === 'shred') { T(90, .25, { type: 'sawtooth', vol: .1, lp: 500, vib: 20, vibAmt: 12 }); T(880, .15, { type: 'sine', vol: .06, to: 1300, delay: .2 }); }
      else if (who === 'asm') { T(523, .12, { type: 'triangle', vol: .07 }); T(392, .12, { type: 'triangle', vol: .07, delay: .12 }); }
      else if (who === 'mirror') this.fam('glass', { vol: .6 });

/* ================================================================
 * BASE DE ESCENA: lo común (temporizadores, partículas, diálogos, pistas, foco, cierre)
 * ============================================================== */
K.base = function (App, id, spec) {
  const S = { App, id, T: 0, tw: new Tweens(), run: K.Runner(), bus: K.Bus(), timers: [], parts: [], focusId: null, hoverId: null, kbd: false,
    pointer: { x: -999, y: -999, inside: false }, lastProgress: 0, done: false, ticket: 0, approved: 0, nudges: 0, hintPt: null, slip: null, verdict: null };
  S.cam = K.Camera(spec.world);
  S.enc = makeEncargado(-120, 866);
  S.cast = Object.assign({ enc: { pos: () => ({ x: S.enc.x + 30, y: S.enc.y - 130 }), voice: 'enc', screen: true, onSay: t => { S.enc.talk = Math.min(3, t.length * .05); } } }, spec.cast || {});
  S.dir = K.Director(S.cast);
  S.hints = K.Hints(spec.hints || []);
  S.clip = K.Clipboard({ x: spec.clipAt ? spec.clipAt.x : 26, y: spec.clipAt ? spec.clipAt.y : 84, title: 'ORDEN DE TRABAJO Nº ' + id, text: spec.order });
  S.later = (t, fn, tag) => S.timers.push({ t, fn, tag });
  S.cancel = tag => S.timers.forEach(x => { if (x.tag === tag) x.dead = true; });
  S.progress = () => { S.lastProgress = S.T; };
  S.say = (who, text, o) => S.dir.line(who, text, o);
  S.toScreen = p => S.cam.toScreen(p);
  S.puff = (x, y, n, col) => { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: U.rand(-90, 90), vy: U.rand(-110, -20), r: U.rand(5, 12), col: col || PAL.bone, life: U.rand(.5, .9), t: 0, kind: 'puff' }); };
  S.confetti = (x, y, n) => { if (Clock.reduced) n = Math.min(n, 12); for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: U.rand(-280, 280), vy: U.rand(-440, -120), r: U.rand(4, 9), rot: U.rand(0, 6), vr: U.rand(-8, 8), col: U.pick([PAL.mustard, PAL.bone, PAL.ultra, PAL.c1, PAL.plum]), life: U.rand(1.4, 2.4), t: 0, kind: 'paper' }); };
  S.sparks = (x, y, n, col) => { for (let i = 0; i < n; i++) { const a = U.rand(0, Math.PI * 2), sp = U.rand(80, 220); S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3, col: col || PAL.mustard, life: .5, t: 0, kind: 'spark' }); } };
  S.encIn = (text, o) => { S.enc.tx = 90; S.later((o && o.delay) || .9, () => S.say('enc', text, { dur: (o && o.dur) || Math.max(3.5, text.length * .06) })); if (o && o.leaveAfter) S.later(o.leaveAfter, () => { S.enc.tx = -120; }); };
  S.giveHint = () => {
    S.cancel('nudge');
    const h = S.hints.next(spec.state());
    if (!h) { S.say('enc', 'No veo nada roto. Abra «¿Qué pasó?» o vuelva a la fábrica.'); return; }
    if (h.who === 'enc' && S.enc.tx < 0) S.enc.tx = 90;
    S.dir.hush(); S.say(h.who, h.text, { dur: Math.max(4, h.text.length * .065) });
    S.hintPt = h.point ? { p: h.point, t: 0 } : null; S.progress();
    return h;
  };
  S.complete = (examples, line) => {
    if (S.done) return false;
    S.done = true; S.dir.hush(); S.enc.tx = 90;
    Sound.fam('repair'); S.later(.7, () => Sound.signature());
    S.later(1.4, () => { S.enc.stamp = 1; S.later(.5, () => { S.tw.add(S, { approved: 1 }, .25); Sound.fam('press'); }); });
    S.later(2.4, () => { S.say('enc', line || 'APROBADO. Vuelva a la fábrica (Esc) cuando quiera.', { dur: 4.5 }); S.tw.add(S, { ticket: 1 }, .6, { ease: Ease.back }); });
    return App.levelComplete(id, examples || {});
  };
  S.update = dt => {
    S.T += dt;
    for (const t of S.timers) { if (t.dead) continue; t.t -= dt; if (t.t <= 0) { t.dead = true; t.fn(); } }
    for (let i = S.timers.length - 1; i >= 0; i--) if (S.timers[i].dead) S.timers.splice(i, 1);
    S.tw.update(dt); S.run.update(dt); S.bus.update(dt); S.dir.update(dt); S.cam.update(dt); S.clip.update(dt);
    if (!S.clipAuto && S.T > 14) { S.clipAuto = true; if (S.clip.target) S.clip.toggle(); }
    updateEncargado(S.enc, dt);
    if (S.slip) { S.slip.update(dt); if (S.slip.closing && S.slip.open <= 0) S.slip = null; }
    if (S.hintPt) { S.hintPt.t += dt; if (S.hintPt.t > 4.5) S.hintPt = null; }
    for (let i = S.parts.length - 1; i >= 0; i--) { const q = S.parts[i]; q.t += dt; if (q.kind === 'paper') { q.vy += 520 * dt; q.vy = Math.min(q.vy, 160); q.rot += q.vr * dt; } else if (q.kind === 'spark') { q.vy += 300 * dt; } else q.vx *= Math.pow(.2, dt); q.x += q.vx * dt; q.y += q.vy * dt; if (q.t > q.life) S.parts.splice(i, 1); }
    // si lleva un rato sin avanzar, alguien señala una observación (sin resolver nada)
    if (!S.done && S.T - S.lastProgress > 45 && !S.dir.busy() && !S.run.active && S.nudges < 3) {
      const h = S.hints.peek(spec.state());

function wake() {
  machine.awake = true; machine.gearTarget = .25; machine.shake = .5;
  bossDo('shock', 1.2); Sound.clunk(); Sound.voice('boss');
  later(.8, () => { say('boss', U.pick(['¡¿Eh?! ¡Turno de noche!', '¡Despierto! ¡Despierto!', '¿Quién encendió esto?'])); bossDo('idle', 1); });
}
function sleep() { machine.awake = false; machine.gearTarget = 0; bossDo('sleep', 99); say('boss', 'Fin de turno.'); Sound.snore(); }
function eatChip(n) {
  const c = chips[n]; c.fly = true; c.inBelly = false; progress.eatenOnce = true;
  tw.add(c, { x: MOUTH.x, y: MOUTH.y + 6, s: .7 }, motion(.45), { ease: Ease.antic, done: () => {
    tw.add(machine, { mouth: 1 }, .08, { done: () => tw.add(machine, { mouth: 0 }, .2, { delay: .1 }) });
    Sound.chomp(); Sound.burp(); machine.bellyShake = .6; c.fly = false; c.inBelly = true; c.s = 1;
    if (n === 4 && nth('eat4') === 1) later(.6, () => say('belly', '*eructo* ...me comí el cuatro.'));
  } });
}
function spitChip(n) {
  const c = chips[n], from = bellySlotWorld(n);
  c.inBelly = false; c.fly = true; c.x = from.x; c.y = from.y; c.s = .55;
  Sound.pop(); machine.bellyShake = .4;
  tw.add(c, { x: SOCKET.x, y: SOCKET.y, s: 1 }, motion(.6), { ease: Ease.back, done: () => { c.fly = false; Sound.snap(); } });
}
function bellyIndex(n) { return L.config.belly.indexOf(n); }
function bellySlotWorld(n) { const i = Math.max(0, bellyIndex(n)); return { x: PORT.x - 18 + i * 36, y: PORT.y + 22 }; }

/* ================================================================
 * EJECUCIÓN DE LA MÁQUINA
 * ============================================================== */
const Run = { active: false, gen: null, wait: 0, scale: 1, paused: false, kind: null, report: null };
function runSpeed() { return (SET.reduced ? 1.6 : 1) * Run.scale; }

function pullLever() {
  if (Run.active) { Run.scale = 7; Run.paused = false; return; }  // tirar otra vez: avanzar rápido
  machine.lever.target = .35; Sound.lever();
  later(.25, () => { machine.lever.target = -1.15; });
  const pre = L.preflight();
  if (!pre.ok) {
    machine.lever.vel -= 30; Sound.clunk(); machine.shake = .25;
    const p = pre.problems[0];
    if (p === 'motor') { Sound.snore(); bossDo('sleep', 99); say('boss', U.pick(['zzz…', 'zzz… cinco minutos más…', 'zzz… (la palanca no hace nada)'])); }
    else if (p === 'chip') { bossDo('shrug', 2); say('boss', '¿Sumar módulo… qué? El cartel no tiene número.'); }
    else if (p === 'puerta') { bossDo('shrug', 2); say('boss', '¿Quién entra en los nidos? Falta la regla de PUERTA.'); }
    return;
  }
  const rep = L.run();
  startRun('full', runGen(rep), rep);
}

function startRun(kind, gen, rep) {
  hold = null;
  Run.active = true; Run.gen = gen; Run.wait = 0; Run.scale = 1; Run.paused = false; Run.kind = kind; Run.report = rep;
  machine.gearTarget = 1.6; machine.mood = 'run';
  progress.lastProgress = realT;
}
function endRun() { Run.active = false; Run.gen = null; machine.gearTarget = machine.awake ? .25 : 0; machine.mood = 'idle'; Run.scale = 1; }
function jamRun() {
  Run.gen = null; Run.active = false;
  rtw.list = [];
  for (const t of tokens) { t.mode = 'walk'; tw.add(t, { y: t.y + 160, alpha: 0 }, .7, { ease: Ease.in }); setExpr(t, 'shock', 2); }
  later(.75, () => { tokens = []; });
  machine.shake = 1; machine.steam = 1.2; machine.gearTarget = 0; Sound.jam(); Sound.steam(); steamAt(MACH.x + 80, MACH.y + 20, 8);
  bossDo('panic', 2.2);
  say('boss', U.pick(['¡¿Cuál de las dos reglas obedezco?!', '¡No cambies las normas a mitad de turno!', '¡Atasco! ¡Dos versiones a la vez!']));
  later(1.6, () => { machine.gearTarget = machine.awake ? .25 : 0; });
  machine.mood = 'idle'; Run.scale = 1;
}

function updateRun(dt) {
  if (!Run.active || Run.paused) return;
  const d = dt * runSpeed();
  rtw.update(d);
  Run.wait -= d;
  let guard = 0;
  while (Run.gen && Run.wait <= 0 && guard++ < 50) {
    const r = Run.gen.next();
    if (r.done) { Run.gen = null; break; }
    Run.wait += r.value || 0;
  }
  if (!Run.gen && !rtw.list.length) endRun();
}

/* --- viajes de fichas --- */
function newToken(kind, v, x, y, o) {
  const t = makeCritter(kind, v, x, y); t.s = (o && o.s) || .78; t.hat = o && o.hat !== undefined ? o.hat : null; t.flag = (o && o.flag) || null;
  t.mode = 'walk'; tokens.push(t); return t;
}
function removeToken(t) { tokens = tokens.filter(q => q !== t); }
/* Encadena tramos: [{pts, dur, mode, hops, start(), end()}] sobre el reloj de ejecución. */
function journey(t, legs, done) {
  let i = 0;
  const next = () => {
    if (i >= legs.length) { if (done) done(); return; }
    const leg = legs[i++];
    if (leg.start) leg.start();
    if (leg.mode) t.mode = leg.mode;
    if (!leg.pts) { rtw.add(t, { _w: 1 }, leg.dur, { done: () => { if (leg.end) leg.end(); next(); } }); return; }
    const pts = leg.pts.slice(); t._u = 0;
    rtw.add(t, { _u: 1 }, leg.dur, { ease: leg.ease || Ease.inOut, update: () => {
      const p = polyAt(pts, t._u); t.x = p.x; t.y = p.y;
      t.hop = leg.hops ? Math.abs(Math.sin(t._u * Math.PI * leg.hops)) * 14 : 0;
    }, done: () => { t.hop = 0; if (leg.end) leg.end(); next(); } });
  };
  next();
  return legs.reduce((s, l) => s + l.dur, 0);
}
/* De la criatura x (o desde un punto) hasta salir por el destino y=f(x). */
function legsThroughMachine(t, x, y, from) {
  const startP = from || { x: srcs[x].hx, y: srcs[x].hy };
  const out = SRC_OUT[x];
  return [
    { pts: [[startP.x, startP.y], [out.x - 8, out.y]], dur: .42, mode: 'walk', hops: 2 },
    { dur: .1, start: () => { poke(t, -6, 8); Sound.slurp(); } },
    { pts: srcPipe(x), dur: .34, mode: 'pipe' },
    { pts: cordPts(x, y, 0), dur: .5, mode: 'bead', start: () => { machine.cordPulse[x] = 1; } },
    { dur: .12, start: () => { machine.rjackPress[y] = 1; Sound.tick(y); t.kind = 'dst'; t.v = y; t.hat = x; puff(RJACK[y].x, RJACK[y].y, 4, PAL.ultraPale); } },
    { pts: dstPipe(y), dur: .34, mode: 'pipe' },
    { dur: .05, mode: 'walk', start: () => { t.x = DST_IN[y].x; t.y = DST_IN[y].y; t.sx.v = .5; t.sy.v = 1.6; Sound.pop(); } },
  ];
}
function residentSpot(y, k) { const offs = [[-46, 6], [46, 6], [-84, 14], [84, 14]]; const o = offs[k % 4]; return { x: PADS[y].x + o[0], y: PADS[y].y + o[1] }; }

/* Fase de traducción: cada criatura manda una copia a su imagen. */
function sendResident(x, y) {
  const t = newToken('src', x, srcs[x].hx, srcs[x].hy, { s: .78 });
  poke(srcs[x], 5, -5); Sound.voice(x);
  const legs = legsThroughMachine(t, x, y);
  const k = residents.filter(r => r.v === y).length + tokens.filter(q => q._dest === y).length;
  t._dest = y;
  const spot = residentSpot(y, k);
  legs.push({ pts: [[DST_IN[y].x, DST_IN[y].y], [spot.x, spot.y]], dur: .38, hops: 2 });
  return journey(t, legs, () => {
    removeToken(t); const r = makeCritter('dst', y, spot.x, spot.y); r.s = .72; r.hat = x; residents.push(r);
    poke(r, 6, -6); Sound.voice(y === 0 ? 'z0' : 'z1');
    const mates = residents.filter(q => q.v === y && q !== r);
    if (mates.length) { r.lookX = -1; mates[0].lookX = 1; setExpr(r, 'shock', 1); }
    hopC(natives[y], 10);
  });
}

function* runGen(rep) {
  progress.runs++;
  const sig = rep.signature, repeat = (progress.failedSigs[sig] || 0) >= 1;
  ledger.prev = ledger.cells.slice(); ledger.cells = Array(16).fill(null); ledger.stale = false; ledger.selected = -1; ledger.blink = -1;
  residents = [];
  bossDo('focus', 99);
  if (repeat) {
    Run.scale = 1.7; bossDo('impatient', 1.6);
    say('boss', U.pick(['Otra vez esta configuración…', 'Ya sé cómo acaba esto.', 'Lo mismo. Vale. Rápido.']));
    yield .5;
  }
  Sound.whoosh(); yield .35;
  // ---------- 1. traducir ----------
  let halted = null;
  for (let x = 0; x < 4; x++) {
    const y = rep.f[x];
    Sound.rhythm(x);
    if (y === null) {
      if (rep.rules.total) { halted = x; break; }
      fallInHole(x); yield .4; continue;
    }
    sendResident(x, y);
    yield .38;
  }
  if (halted !== null) {
    yield .3;
    const c = srcs[halted];
    const t = newToken('src', halted, c.hx, c.hy, { s: .78 });
    journey(t, [{ pts: [[c.hx, c.hy], [SRC_OUT[halted].x - 10, SRC_OUT[halted].y]], dur: .4, hops: 2 },
      { dur: .3, start: () => { machine.shake = .4; Sound.buzz(); setExpr(t, 'shock', 2); } },
      { pts: [[SRC_OUT[halted].x - 10, SRC_OUT[halted].y], [c.hx + 30, c.hy - 90], [c.hx, c.hy]], dur: .55, ease: Ease.out, start: () => Sound.boing() }],
      () => { removeToken(t); poke(c, 8, -8); setExpr(c, 'sad', 2.5); });
    yield .6;
    say('boss', U.pick(['¿Y éste a dónde va? TODO TIENE IMAGEN, dice la norma.', 'Falta un cable. La regla dice TODO.', '¡Uno sin destino! Así no arranco.']));
    bossDo('shrug', 2);
    yield 1.2;
    finish(rep, 'incomplete'); return;
  }
  yield 1.9;
  if (!rep.rules.conserve) { finish(rep, rep.verdict); return; }
  // ---------- 2. conservar la suma: los 16 pares ----------
  tw.add(scaleS, { show: 1 }, .3);
  yield .4;
  const cx = rep.check.counterexample;
  const showcase = [0, 1, 5];
  for (let i = 0; i < 16; i++) {
    const p = rep.check.pairs[i];
    const full = showcase.indexOf(i) !== -1 || p === cx;
    if (full) {
      const dur = playPair(p, rep);
      yield dur;
      judgePair(i, p, true);
      yield p.ok ? .45 : 1.3;
    } else {
      flickPair(i, p);
      yield Math.max(.07, .2 - i * .008);
    }
  }
  yield .3;
  finish(rep, rep.verdict);
}

function fallInHole(x) {
  const c = srcs[x], t = newToken('src', x, c.hx, c.hy + 20, { s: .78 });
  setExpr(t, 'shock', 3); Sound.fall();
  rtw.add(t, { y: c.hy + 70, s: .1, alpha: 0 }, .6, { ease: Ease.in, done: () => removeToken(t) });
}

/* Un par (a,b) por las dos rutas en paralelo. Devuelve la duración. */
function playPair(p, rep) {
  const a = p.a, b = p.b;
  scaleS.pair = p; scaleS.valA = null; scaleS.valB = null; scaleS.beam.target = 0;
  if (scaleS.panA) removeToken(scaleS.panA); if (scaleS.panB) removeToken(scaleS.panB);
  scaleS.panA = scaleS.panB = null;
  const panA = { x: SCALE.x - 100, y: SCALE.y + 70 }, panB = { x: SCALE.x + 100, y: SCALE.y + 70 };
  // ---- Ruta A: sumar en el reloj grande, luego traducir ----
  const A1 = newToken('src', a, srcs[a].hx, srcs[a].hy, { flag: 'A' }), A2 = newToken('src', b, srcs[b].hx, srcs[b].hy, { flag: 'A' });
  poke(srcs[a], 5, -5); poke(srcs[b], 5, -5);
  const mA = { x: SRC_C.x - 12, y: SRC_C.y - 8 };
  journey(A1, [{ pts: [[A1.x, A1.y], [mA.x - 14, mA.y]], dur: .45, hops: 2 }]);
  journey(A2, [{ pts: [[A2.x, A2.y], [mA.x + 14, mA.y]], dur: .45, hops: 2 }], () => {
    removeToken(A1); removeToken(A2); Sound.pop(); puff(mA.x, mA.y, 6, PAL.mustard);
    const s = p.sumG, R = newToken('src', s, mA.x, mA.y, { flag: 'A' }); R.sx.v = 1.6; R.sy.v = .4;
    reactSum(R, a, b, s);
    const y = rep.f[s];
    const legs = legsThroughMachine(R, s, y, mA);
    legs.push({ pts: [[DST_IN[y].x, DST_IN[y].y], [DST_IN[y].x + 10, 250], [panA.x, panA.y - 4]], dur: .55, ease: Ease.inOut });
    journey(R, legs, () => { scaleS.panA = R; scaleS.valA = y; Sound.clunk(); scaleS.beam.vel += 3; });
  });
  // ---- Ruta B: traducir por separado, luego sumar en el reloj pequeño ----
  const fa = rep.f[a], fb = rep.f[b], mB = { x: DST_C.x - 46, y: DST_C.y + 2 };
  const B1 = newToken('src', a, srcs[a].hx, srcs[a].hy, { flag: 'B' }), B2 = newToken('src', b, srcs[b].hx, srcs[b].hy, { flag: 'B' });
  let arrived = 0;
  const meet = () => {
    if (++arrived < 2) return;
    removeToken(B1); removeToken(B2); Sound.pop(); puff(mB.x, mB.y, 6, PAL.plum);
    const sum = p.routeB;
    if (p.status === 'escape') {
      const ghost = newToken('ghost', sum, mB.x, mB.y, { flag: 'B' }); ghost.sx.v = 1.6; ghost.sy.v = .4; setExpr(ghost, 'shock', 3);
      const ph = PHANTOM[sum] || { x: mB.x + 120, y: mB.y };
      journey(ghost, [{ pts: [[mB.x, mB.y], [ph.x, ph.y]], dur: .5, hops: 2 },
        { dur: .2, start: () => say(ghost, '¡No hay suelo para el ' + sum + '!', { dur: 1.6, announce: false }) },
        { pts: [[ph.x, ph.y], [ph.x, ph.y + 260]], dur: .5, ease: Ease.in, start: () => Sound.fall() }],
        () => { removeToken(ghost); scaleS.valB = 'escape'; });
      return;
    }
    const R = newToken('dst', sum, mB.x, mB.y, { flag: 'B' }); R.sx.v = 1.6; R.sy.v = .4;
    journey(R, [{ pts: [[mB.x, mB.y], [mB.x + 60, 250], [panB.x, panB.y - 4]], dur: .6 }], () => { scaleS.panB = R; scaleS.valB = sum; Sound.clunk(); scaleS.beam.vel -= 3; });
  };
  rtw.add({ d: 0 }, { d: 1 }, .12, { done: () => {
    const l1 = legsThroughMachine(B1, a, fa); l1.push({ pts: [[DST_IN[fa].x, DST_IN[fa].y], [mB.x - 16, mB.y]], dur: .4, hops: 2 });
    const l2 = legsThroughMachine(B2, b, fb); l2.push({ pts: [[DST_IN[fb].x, DST_IN[fb].y], [mB.x + 16, mB.y]], dur: .4, hops: 2 });
    l2.unshift({ dur: .22 });
    journey(B1, l1, meet); journey(B2, l2, meet);
  } });
  return 3.6;
}
/* Personalidad en las sumas del reloj grande. */
function reactSum(R, a, b, s) {
  if (s === 0 && (a || b)) { setExpr(R, 'sleepy', 1.5); R.flat = .9; rtw.add(R, { flat: 0 }, .5, { delay: .3 }); }
  if (a === 2 && b === 2 && nth('2+2') <= 2) say(R, '¿2 y 2… CERO?', { dur: 1.4, announce: false });
  if (s === 3) setExpr(R, 'proud', 1.5);
}
function judgePair(i, p, loud) {
  const st = p.status;
  ledger.cells[i] = st; ledger.pop[i] = 1;
  if (st === 'ok') { scaleS.beam.target = 0; if (loud) { Sound.ding(); [scaleS.panA, scaleS.panB].forEach(t => { if (t) { setExpr(t, 'happy', 1.5); poke(t, 6, -6); } }); } }
  else {
    const vA = p.routeA, vB = st === 'escape' ? -1 : p.routeB;
    scaleS.beam.target = vA > vB ? -.2 : .2;
    if (loud) {
      Sound.buzz(); machine.shake = .35;
      [scaleS.panA, scaleS.panB].forEach(t => { if (t) { setExpr(t, 'angry', 2.4); t.shake = .8; } });
      if (scaleS.panA && scaleS.panB) { later(.2, () => say(scaleS.panA, U.pick(['¡Yo salí primero!', '¡A mí me sumaron antes!', '¡Mentira!']), { dur: 1.5, announce: false })); }
      ledger.blink = i;
    }
  }
  if (loud) announce('Par ' + p.a + ' + ' + p.b + ': ruta A da ' + p.routeA + ', ruta B da ' + (st === 'escape' ? p.routeB + ' (sin casa)' : p.routeB) + '. ' + (st === 'ok' ? 'Coinciden.' : 'No coinciden.'));
}
function flickPair(i, p) {
  scaleS.pair = p; scaleS.valA = p.routeA; scaleS.valB = p.status === 'escape' ? 'escape' : p.routeB;
  if (scaleS.panA) { removeToken(scaleS.panA); scaleS.panA = null; } if (scaleS.panB) { removeToken(scaleS.panB); scaleS.panB = null; }
  judgePair(i, p, false); Sound.tick(i); scaleS.flash = 1;
  machine.cordPulse[p.a] = .6; machine.cordPulse[p.b] = .6;
}

function finish(rep, verdict) {
  progress.lastRun = rep;
  if (progress.formula < 1) progress.formula = 1;
  // la orden de trabajo refleja exactamente la última ejecución (verdad lógica, no acumulada)
  order.sums = rep.order.sums; order.visits = rep.order.visits; order.done = rep.order.done; order.stampTxt = null;
  const exploring = progress.solved && rep.signature !== progress.solvedSig;
  if (exploring && !marks.investiga) { marks.investiga = true; marks.pop.investiga = 1; }
  if (verdict === 'homomorphism' && rep.order.done) {
    bossDo('cheer', 3); machine.shake = .3; confetti(boss.x, boss.y - 10, 60); Sound.signature();
    say('boss', U.pick(['¡Ni una sola suma rota! Rutina, rutina.', '¡Funciona! Como siempre. Bueno… como nunca.', '¡Dieciséis de dieciséis! ¡Me merezco un café!']));
    if (!progress.solved) {
      progress.solved = true; progress.solvedSig = rep.signature; progress.solvedRun = rep; progress.formula = 2;
      marks.funciona = true; marks.pop.funciona = 1;
      later(2.6, revealCollision, 'reveal');
      later(10.5, () => {
        App.levelComplete(1, { homomorfismo: { G: 'Z4', H: 'Z2', f: rep.f.slice(), from: 'máquina 1' } });
        enc.stamp = 1; later(.5, () => { tw.add(order, { approved: 1 }, .25); Sound.clunk(); });
        later(1.2, () => encSay('APROBADO. Siguiente avería: la garra del núcleo. Vuelva a la fábrica (Esc) cuando quiera.', { dur: 5 }));
      }, 'reveal');
    } else later(1.6, () => say(residents.find(r => r.v === 0) || natives[0], 'Seguimos siendo dos aquí.'), 'reveal');
  } else if (verdict === 'homomorphism') {
    bossDo('proud', 2.4); Sound.ding();
    say('boss', 'Técnicamente perfecto: todo al mismo agujero.');
    later(1.7, () => { say(natives[1], '¿Y a mí nadie me visita?'); setExpr(natives[1], 'sad', 3); natives[1].shake = .3; });
    stampOrder('CASI');
  } else if (verdict === 'broken') {
    progress.failedSigs[rep.signature] = (progress.failedSigs[rep.signature] || 0) + 1;
    bossDo('facepalm', 2.4); Sound.kazoo(); machine.steam = .9; steamAt(MACH.x + MACH.w - 60, MACH.y + 30, 6);
    const cx = rep.check.counterexample;
    ledger.selected = rep.check.pairs.indexOf(cx);
    scaleS.pair = cx; scaleS.valA = cx.routeA; scaleS.valB = cx.status === 'escape' ? 'escape' : cx.routeB; scaleS.beam.target = cx.status === 'escape' || cx.routeA > cx.routeB ? -.2 : .2;
    if (scaleS.panA) { removeToken(scaleS.panA); scaleS.panA = null; } if (scaleS.panB) { removeToken(scaleS.panB); scaleS.panB = null; }
    if (cx.status === 'escape') say('boss', '¡' + cx.a + ' + ' + cx.b + ' da ' + cx.routeB + ' allá, y allá no hay ' + cx.routeB + '!');
    else say('boss', U.pick(['Las rutas no se ponen de acuerdo en ' + cx.a + ' + ' + cx.b + '.', 'Ruta A y Ruta B discuten por ' + cx.a + ' + ' + cx.b + '.', '¡En ' + cx.a + ' + ' + cx.b + ' la balanza se tuerce!']));
    if (progress.solved && rep.rules.exclusive) investigateNote();
  } else if (verdict === 'unchecked' || verdict === 'partial-unchecked') {
    bossDo('proud', 2.5); Sound.ding();
    say('boss', U.pick(['¡Traducido! ¿Comprobar? ¿Para qué?', '¡Hecho! No he mirado nada, pero ¡hecho!']));
    stampOrder('SIN COMPROBAR');
  } else if (verdict === 'uncertifiable') {
    bossDo('shrug', 2.4); Sound.kazoo();
    say('boss', 'Algunos se cayeron al agujero. No puedo firmar esto.');
    rep.check.pairs.forEach((p, i) => { ledger.cells[i] = p.status; ledger.pop[i] = 1; });
  } else if (verdict === 'incomplete') {
    stampOrder('INCOMPLETO');
    if (progress.solved && rep.rules.exclusive) investigateNote();
  }
}
function investigateNote() {
  later(1.8, () => { say('boss', 'Cuatro en dos nidos, de uno en uno… imposible. Esta máquina no sabe volver atrás.', { dur: 5 }); bossDo('thinking', 4); });
  if (!marks.investiga) { marks.investiga = true; marks.pop.investiga = 1; }
}
function stampOrder(txt) { order.stampTxt = txt; order.stampT = 1; Sound.clunk(); }

/* La sorpresa: la máquina funciona, pero dos llegaron al mismo sitio. */
function revealCollision() {
  const zeros = residents.filter(r => r.v === 0);
  if (zeros.length >= 2) {
    zeros[0].lookX = 1; zeros[1].lookX = -1;
    say(zeros[0], 'Oye… tú también eres un 0.'); setExpr(zeros[0], 'shock', 2.5);
    later(1.8, () => { say(zeros[1], '¡Pero yo era un 2!'); setExpr(zeros[1], 'angry', 2.5); zeros[1].shake = .4; });
  }

  const y = reverseY; reverseY = 1 - reverseY;
  const r = L.reverse(y);
  const gen = (function* () {
    const t = newToken('dst', y, PADS[y].x - 46, PADS[y].y + 6, { s: .78 });
    const back = dstPipe(y).slice().reverse();
    journey(t, [{ pts: [[t.x, t.y], [DST_IN[y].x, DST_IN[y].y]], dur: .45, hops: 2 }, { pts: back, dur: .35, mode: 'pipe' }, { dur: .1, mode: 'bead', start: () => { t.x = RJACK[y].x; t.y = RJACK[y].y; } }]);

    rtw.add(t, { alpha: 0 }, .4, { done: () => removeToken(t) });

function hintTopic() {

  if (mapped < 4) return 'cables';

  if (k === 'ArrowRight' || k === 'ArrowDown') { kbdMode = true; moveFocus(1); return true; }

  if (k === 'Enter' || k === ' ') { const o = focusables().find(q => q.id === focusId); if (o) { App.levelStarted(1); o.act(); if (hold && o.kind === 'src') { focusId = 'pad:0'; } } return true; }
  if (k === 'Escape') { if (hold) { hold = null; return true; } return false; }
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { knobAct('undo'); return true; }
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (/^[0-3]$/.test(k)) {
    App.levelStarted(1);
    const n = +k;
    if (hold && n <= 1) { tryPlug(hold.x, n); }
    else { hold = { x: n }; Sound.voice(n); poke(srcs[n], 5, -5); announce('Cable del ' + n + ' en la mano. Pulsa 0 o 1 para elegir nido.'); }
    return true;
  }
  if (k === 'Delete' || k === 'Backspace') { const o = focusables().find(q => q.id === focusId); if (o && o.kind === 'src') L.unplug(o.ref); else if (hold) { L.unplug(hold.x); hold = null; } return true; }
  const lk = k.toLowerCase();
  if (lk === 'r') { App.levelStarted(1); pullLever(); }
  else if (lk === 'p') knobAct('pause');
  else if (lk === 'z' || lk === 'u') knobAct('undo');
  else if (lk === 'n') knobAct('reset');
  else if (lk === 'h') knobAct('hint');
  else if (lk === 'v') knobAct('replay');
  else if (lk === 'b' && machine.reverseOut > .5) knobAct('reverse');
  else if (lk === 'i' && machine.ticketOut > .5) openReport();
  else if (lk === 'f') toggleFormula();
  else return false;
  return true;
}
